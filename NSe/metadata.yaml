# NSe area metadata — read by ocean-post reporting.py
#
# ---------------------------------------------------------------------------
# input_generation — how each set of input files is produced.
#
# Each entry:
#   label       — heading shown in the report
#   description — one-sentence summary
#   configs     — list of {label, github_url, cli, note}
#                 github_url is rendered as a hyperlink to the config on GitHub
# ---------------------------------------------------------------------------
input_generation:

  bathymetry:
    label: "Bathymetry"
    description: >
      Regridded conservatively from GEBCO 2025 onto the NSe ~1/12° spherical
      grid using bathymetry-regrid (ocean-prep), with Beckmann-Haidvogel
      smoothing (rx0 ≤ 0.2) and manual depth fixes for Belt Sea straits and
      Skagen.  Output: bathymetry_nse.nc with variables lon, lat, mask, H.
    configs:
      - label: "NSe bathymetry config"
        github_url: "https://github.com/bolding/ocean-prep/blob/main/config/nse_bathy_create.yaml"
        cli: "bathymetry-regrid --config config/nse_bathy_create.yaml"
        note: "Config not yet committed — will be added once NSe grid parameters are finalised."

  boundaries:
    - label: "CMEMS historical boundaries (T, S, SSH, currents)"
      description: >
        AMM7 NWS MY reanalysis (1993–2026-04-30) blended with AMM15 NWS ANFC
        (2026-05-01 onwards).  Segment 7 (eastern Kattegat) overridden with
        Baltic products for all variables; SSH uses Baltic detided product
        from 2022-12-02.  Processed with ocean-prep run_cmems_boundaries.
      configs:
        - label: "NSe CMEMS boundary config"
          github_url: "https://github.com/bolding/ocean-prep/blob/main/config/nse_bdy_create.yaml"
          cli: "python cli/run_cmems_boundaries.py --config config/nse_bdy_create.yaml"

    - label: "Tidal boundaries (TPXO9 + CMIP6 mean SSH / barotropic transport)"
      description: >
        TPXO9-atlas (13 constituents) tidal prediction for zos, uo, vo
        combined with CMIP6 monthly mean sea-surface height and
        depth-integrated barotropic transport.  Scenario-specific; see
        Scenario Summary table below.
      configs:
        - label: "NSe tidal boundary config"
          github_url: "https://github.com/bolding/ocean-prep/blob/main/config/nse_tidal_bdy.yaml"
          cli: "run-tidal-boundaries --config config/nse_tidal_bdy.yaml"

    - label: "3-D delta-change boundaries (T, S and optionally currents)"
      description: >
        Future 3-D boundary conditions via the delta-change method:
        AMM7/AMM15 historical CMEMS reference cycled over the output period,
        with a CMIP6 monthly change signal (future 20-yr climatology minus
        historical 1985–2014 climatology) added at each boundary point.
        Scenario-specific; see Scenario Summary table below.
      configs:
        - label: "NSe delta-change boundary config"
          github_url: "https://github.com/bolding/ocean-prep/blob/main/config/nse_delta_bdy.yaml"
          cli: "run-delta-boundaries --config config/nse_delta_bdy.yaml --scenario ssp126"

  initial_conditions:
    - label: "Initial conditions (temperature, salinity)"
      description: >
        Monthly snapshots (1st of each month) from CMEMS NWS products — AMM7
        MY reanalysis or AMM15 ANFC — with the Baltic ANFC product filling
        the southern Kattegat masked halo.  Flood-fill propagates valid values
        into any remaining NaN cells on the model grid.
      configs:
        - label: "NSe initial conditions config"
          github_url: "https://github.com/bolding/ocean-prep/blob/main/config/nse_init_create.yaml"
          cli: "python cli/download_init_conditions.py --config config/nse_init_create.yaml --source AMM7 --year 2015"

# ---------------------------------------------------------------------------
# scenario_matrix — one table per CMIP6 model, rows = boundary type,
# columns = SSP scenarios.  Mirrors the meteo bias-correction table layout.
#
# _ssp_labels / _type_labels: human-readable display names.
# models.<MODEL>.<boundary_type>.<scenario>:
#   variables  — variables taken from this model/scenario combination
#   note       — optional footnote shown in the table cell
# ---------------------------------------------------------------------------
scenario_matrix:
  description: >
    Future conditions use CMIP6 model output: as the climate-change
    signal on top of the historical CMEMS reference (AMM7/AMM15, same
    for all scenarios) for ocean boundaries; bias-corrected directly
    against ERA5 for atmospheric forcing. Four input types per model/
    scenario: 2-D tidal mean state, 3-D boundary delta-change, 3-D
    biogeochemical boundary tracers, and atmospheric forcing.

  _ssp_labels:
    ssp126: "SSP1-2.6"
    ssp245: "SSP2-4.5"
    ssp370: "SSP3-7.0"
    ssp585: "SSP5-8.5"

  _type_labels:
    tidal_mean_state: "Tidal mean state (2-D)"
    delta_3d: "3-D delta-change"
    meteo: "Atmospheric forcing (bias-corrected)"
    fabm: "Biogeochemical boundary (3-D)"

  # All three model/scenario tables below re-verified against the real
  # files on bb-server1, 2026-10-21 (previously only partially filled
  # in, and in one place wrong -- see tidal_mean_state's and delta_3d's
  # own notes). Two real, open findings surfaced doing this that are
  # NOT resolved here, just flagged, since they're data-quality
  # questions, not documentation staleness:
  #  1. tidal_mean_state's uo/vo: the variable IS present in every real
  #     bdy_2d_*.nc file (all 3 models), but with an implausible range
  #     (~-130..190, vs zos's realistic -4..4 m) -- consistently across
  #     all three models, so probably a known placeholder/extrapolation
  #     artifact rather than real transport, not something to just
  #     mark "available" without checking with whoever generated these.
  #  2. meteo's ssp245/ssp585 (MPI-ESM1-2-HR only): real files exist
  #     but for a visibly incomplete variable subset (7-8 of the normal
  #     13), not a full bias-corrected set -- flagged per-cell below
  #     rather than guessing why.
  models:
    GFDL-ESM4:
      tidal_mean_state:
        ssp126:
          variables: [zos, uo, vo]
          note: "uo/vo present but implausible magnitude -- see scenario_matrix's own header note"
        ssp370:
          variables: [zos, uo, vo]
          note: "uo/vo present but implausible magnitude -- see scenario_matrix's own header note"
      delta_3d:
        ssp126:
          variables: [thetao, so]
          note: "no uo/vo boundary files exist at all for any model/scenario"
        ssp370:
          variables: [thetao, so]
      fabm:
        ssp126:
          variables: [dissic, no3, o2, po4, si, talk]
        ssp370:
          variables: [dissic, no3, o2, po4, si, talk]
      meteo:
        ssp126:
          variables: [evspsbl, huss, net_lw, net_sw, pr, psl, rlds, rlus, rsds, rsus, tas, uas, vas]
        ssp370:
          variables: [evspsbl, huss, net_lw, net_sw, pr, psl, rlds, rlus, rsds, rsus, tas, uas, vas]

    MPI-ESM1-2-HR:
      tidal_mean_state:
        ssp126:
          variables: [zos, uo, vo]
          note: "uo/vo present but implausible magnitude -- see scenario_matrix's own header note"
        ssp370:
          variables: [zos, uo, vo]
          note: "uo/vo present but implausible magnitude -- see scenario_matrix's own header note"
      delta_3d:
        ssp126:
          variables: [thetao, so]
        ssp370:
          variables: [thetao, so]
      fabm:
        ssp126:
          variables: [dissic, no3, o2, po4, si, talk]
        ssp370:
          variables: [dissic, no3, o2, po4, si, talk]
      meteo:
        ssp126:
          variables: [evspsbl, huss, net_lw, net_sw, pr, psl, rlds, rlus, rsds, rsus, tas, uas, vas]
        ssp245:
          variables: [evspsbl, huss, net_lw, net_sw, pr, rsds, tas]
          note: "incomplete set (7 of 13) -- not a full bias-corrected run"
        ssp370:
          variables: [evspsbl, huss, net_lw, net_sw, pr, psl, rlds, rlus, rsds, rsus, tas, uas, vas]
        ssp585:
          variables: [evspsbl, huss, pr, rlds, rsds, tas, uas, vas]
          note: "incomplete set (8 of 13) -- not a full bias-corrected run"

    CNRM-ESM2-1:
      tidal_mean_state:
        ssp126:
          variables: [zos, uo, vo]
          note: "uo/vo present but implausible magnitude -- see scenario_matrix's own header note"
        ssp370:
          variables: [zos, uo, vo]
          note: "uo/vo present but implausible magnitude -- see scenario_matrix's own header note"
      delta_3d:
        ssp126:
          variables: [thetao, so]
        ssp370:
          variables: [thetao, so]
      fabm:
        ssp126:
          variables: [dissic, no3, o2, po4, si, talk]
        ssp370:
          variables: [dissic, no3, o2, po4, si, talk]
      meteo:
        ssp126:
          variables: [evspsbl, huss, pr, psl, rlus, rsds, tas, uas, vas]
          note: "incomplete set (9 of 13) -- missing net_lw/net_sw/rlds/rsus"
        ssp370:
          variables: [evspsbl, huss, net_lw, pr, psl, rlds, rlus, rsds, tas, uas, vas]
          note: "incomplete set (11 of 13) -- missing net_sw/rsus"
