# NSe area metadata for ocean-post reporting
#
# Pointers to diagnostics directories (used by reporting.py for plots / tables)
boundaries_dir: boundary_data/diagnostics
bathymetry_dir: ""          # no dedicated diagnostics dir yet
initial_conditions_dir: ""  # no dedicated diagnostics dir yet

# ---------------------------------------------------------------------------
# input_generation — describes how every set of input files was produced.
# Each entry has:
#   label       — human-readable name shown as a heading
#   description — one-sentence summary
#   configs     — list of {path, cli} pairs; path is read and embedded
#                 as a YAML code block; cli shows the command to re-run
# ---------------------------------------------------------------------------
input_generation:

  bathymetry:
    label: "Bathymetry"
    description: >
      Bathymetry generated from GEBCO 2025 using pyGETM, interpolated onto the
      NSe spherical grid with Beckmann-Haidvogel (rx0 ≤ 0.2) smoothing and
      manual masking of narrow straits (Belt Sea, Skagen).
    configs:
      - label: "Generation script"
        path: /home/kb/source/repos/OceanICU/oceanicu_3d/Bathymetry/create_bathymetry.py
        language: python
        cli: "python create_bathymetry.py nse --rx0 0.2"
        note: >
          Script embeds domain definition (−8 – 13 °E, 47.5 – 62 °N, ~1/12°
          spherical grid) and manual mask corrections for the Kattegat straits.
          Output: Bathymetry/bathymetry_nse.nc

  boundaries:
    - label: "CMEMS historical boundaries (temperature, salinity, SSH, currents)"
      description: >
        AMM7 NWS MY reanalysis (1993 – 2026-04-30) blended with AMM15 NWS ANFC
        (2026-05-01 onwards).  Segment 7 (eastern Kattegat) overridden with
        Baltic products throughout.  Processed with ocean-prep run_cmems_boundaries.
      configs:
        - label: "NSe CMEMS boundary config"
          path: /home/kb/source/repos/ocean-prep/config/nse_bdy_create.yaml
          language: yaml
          cli: "python cli/run_cmems_boundaries.py --config config/nse_bdy_create.yaml"

    - label: "Tidal boundaries (TPXO9 + CMIP6 mean SSH / barotropic transport)"
      description: >
        TPXO9 tidal prediction for zos, uo, vo combined with CMIP6 monthly mean
        sea-surface height and depth-integrated barotropic transport from
        GFDL-ESM4 (ssp126) or another CMIP6 source.
      configs:
        - label: "NSe tidal boundary config"
          path: /home/kb/source/repos/ocean-prep/config/nse_tidal_bdy.yaml
          language: yaml
          cli: "run-tidal-boundaries --config config/nse_tidal_bdy.yaml"

    - label: "3-D delta-change boundaries (temperature, salinity, …)"
      description: >
        Future 3-D boundary conditions via the delta-change method: AMM7/AMM15
        historical reference cycled over the output period with a monthly CMIP6
        change signal (future climatology − historical climatology) added.
      configs:
        - label: "NSe delta-change boundary config"
          path: /home/kb/source/repos/ocean-prep/config/nse_delta_bdy.yaml
          language: yaml
          cli: "run-delta-boundaries --config config/nse_delta_bdy.yaml"

  initial_conditions:
    - label: "Initial conditions (temperature, salinity)"
      description: >
        Monthly snapshots (1st of each month) of temperature and salinity
        downloaded from CMEMS NWS products (AMM7 MY or AMM15 ANFC) with the
        Baltic ANFC product filling the southern Kattegat masked halo.
        Flood-filled onto the full model domain.
      configs:
        - label: "NSe initial conditions config"
          path: /home/kb/source/repos/ocean-prep/config/nse_init_create.yaml
          language: yaml
          cli: "python cli/download_init_conditions.py --config config/nse_init_create.yaml --source AMM7"

# ---------------------------------------------------------------------------
# scenario_matrix — documents which CMIP6 model/source is used for each SSP
# scenario, for each type of ocean boundary forcing.  Rendered as a comparison
# table on the area page (analogue to the meteo bias-correction scenario page).
#
# boundary_type keys map to display labels:
#   tidal_mean_state  — CMIP6 mean SSH / barotropic transport added to TPXO
#   delta_3d          — CMIP6 monthly change signal added to CMEMS reference
# ---------------------------------------------------------------------------
scenario_matrix:
  description: >
    Ocean boundary conditions for future projections use CMIP6 model output
    as the climate-change signal.  The table below shows which model and
    variables are used for each SSP scenario.

  _ssp_labels:
    ssp126: "SSP1-2.6 — Low emissions"
    ssp245: "SSP2-4.5 — Intermediate emissions"
    ssp370: "SSP3-7.0 — High emissions"
    ssp585: "SSP5-8.5 — Very high emissions"

  _type_labels:
    tidal_mean_state: "Tidal mean state (2-D)"
    delta_3d: "3-D delta-change"

  scenarios:
    ssp126:
      tidal_mean_state:
        model: GFDL-ESM4
        variables: [zos]
        note: "uo/vo absent from ESGF for GFDL-ESM4/ssp126 — tidal contribution only"
      delta_3d:
        model: GFDL-ESM4
        variables: [thetao, so]
        note: "uo/vo not available on ESGF for this model/scenario"

    ssp370:
      tidal_mean_state:
        model: GFDL-ESM4
        variables: [zos, uo, vo]
        note: ""
      delta_3d:
        model: MPI-ESM1-2-HR
        variables: [thetao, so, uo, vo]
        note: ""
