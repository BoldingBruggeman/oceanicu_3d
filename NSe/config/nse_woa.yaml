domain:
  method: BathymetryFile
  BathymetryFile:
    path: ${BATHYMETRY_FOLDER}/bathymetry_nse.nc
    depth_variable: depth_rx0_0p20
    lon_variable: lon
    lat_variable: lat
    mask_variable: ocean_mask
    z0: 0.01
open_boundaries:
- side: LEFT
  l: 0
  mstart: 0
  mstop: 73
  type_2d: FLATHER_TRANSPORT
- side: LEFT
  l: 0
  mstart: 137
  mstop: 169
  type_2d: FLATHER_TRANSPORT
- side: LEFT
  l: 16
  mstart: 201
  mstop: 214
  type_2d: FLATHER_TRANSPORT
- side: LEFT
  l: 36
  mstart: 214
  mstop: 227
  type_2d: FLATHER_TRANSPORT
- side: TOP
  l: 213
  mstart: 17
  mstop: 36
  type_2d: FLATHER_TRANSPORT
  type_3d: ZERO_GRADIENT
- side: TOP
  l: 226
  mstart: 37
  mstop: 77
  type_2d: FLATHER_TRANSPORT
- side: TOP
  l: 246
  mstart: 84
  mstop: 154
  type_2d: FLATHER_TRANSPORT
- side: RIGHT
  l: 256
  mstart: 120
  mstop: 136
  type_2d: FLATHER_TRANSPORT
- side: BOTTOM
  l: 0
  mstart: 1
  mstop: 35
  type_2d: FLATHER_TRANSPORT
simulation:
  runtype: BAROCLINIC
  gotm: gotm.yaml
  Dcrit: 0.5
  Dmin: 0.1
  advection_scheme: SUPERBEE
  vertical_coordinates:
    type: GVC
    Sigma:
      nz: 40
      ddl: 0.0
      ddu: 0.0
    GVC:
      nz: 40
      ddu: 0.75
      ddl: 0.75
      Dgamma: 10.0
      gamma_surf: true
    Adaptive:
      nz: 40
      ddu: 0.001
      ddl: 0.001
      gamma_surf: true
      Dgamma: 10.0
      csigma: 0.0
      cgvc: 1.0
      chsurf: 0.0
      hsurf: 0.5
      chmidd: 0.0
      hmidd: -4.0
      chbott: 0.0
      hbott: -0.25
      decay: 0.6666666666666666
      hpow: 3
      cneigh: 0.0
      rneigh: 0.25
      cNN: 4.0
      drho: 0.3
      cSS: 0.0
      dvel: 0.1
      chmin: 2
      hmin: 0.75
      nvfilter: 1
      vfilter: 0.3
      nhfilter: 1
      hfilter: 0.4
      timescale: 14400.0
  internal_pressure:
    type: ShchepetkinMcwilliams
    Prescribed:
      idpdx: 0.0
      idpdy: 0.0
    BlumbergMellor: {}
    ShchepetkinMcwilliams: {}
  airsea:
    type: FluxesFromMeteo
    Fluxes:
      taux: 0.01
      tauy: 0.01
      sp: 101325.0
      pe: 0.0
      shf: -50.0
      swr: 50.0
    FluxesFromMeteo:
      shortwave_method: ROSATI_MIYAKODA
      longwave_method: CLARK
      humidity_measure: DEW_POINT_TEMPERATURE
      calculate_evaporation: true
      albedo_method: PAYNE
  radiation:
    type: TwoBand
    Radiation: {}
    TwoBand:
      reflect_at_bottom: false
  momentum:
    An: 25
    Am: 0
    cnpar: 1
    avmmol: 1.8e-06
    advection_scheme: null
    advection_split_2d: FULL
    coriolis_scheme: DEFAULT
runtime:
  timestep: 20
  split_factor: 40
  dump_on_error: true
  profile: null
  check_finite: true
  report:
    days: 1
  report_totals:
    days: 7
  debug_output: false
  save_restart_interval: null
  save_restart_interval_units: null
data_assignments:
- target: simulation.radiation.A
  kind: constant
  constant_value: 0.7
- target: simulation.radiation.kc1
  kind: constant
  constant_value: 0.54
- target: simulation.radiation.kc2
  kind: constant
  constant_value: 3.23
- target: open_boundary.temp
  kind: boundary_type
  boundary_condition_type: SPONGE
- target: open_boundary.salt
  kind: boundary_type
  boundary_condition_type: SPONGE
output:
  folder: ${OUTPUT_FOLDER}
  variable_groups:
    airsea_standard:
    - u10
    - v10
    - sp
    - t2m
    - tcc
    - tp
    airsea_fluxes:
    - swr
    - shf
    - tausxu
    - tausyv
    tidal:
    - zt
    - u1
    - v1
    barotropic_2d:
    - Ht
    - zt
    - Dt
    - u1
    - v1
    barotropic_3d:
    - uk
    - vk
    - ww
    - SS
    - num
    baroclinic_3d:
    - temp
    - salt
    - rho
    - nuh
    barotropic_2d_debug:
    - maskt
    - masku
    - maskv
    - dxt
    - dyt
    - Hu
    - Hv
    - U
    - V
    - Du
    - Dv
    - dpdx
    - dpdy
    - z0bu
    - z0bv
    - z0bt
    - ru
    - rv
    barotropic_3d_debug:
    - rru
    - rrv
    - advpk
    - advqk
    - diffpk
    - diffqk
    baroclinic_3d_debug:
    - rad
    - sst
    - hnt
    - idpdx
    - idpdy
    surface_variables_3d:
    - temp
    - salt
    bottom_variables_3d:
    - temp
    - salt
    fabm_ersem_3D:
    - P1_c
    - P2_c
    - P3_c
    - P4_c
    - O2_o
    - N3_n
    - N4_n
    - N1_p
    - N5_s
    - O3_c
    fabm_ersem_2D:
    - Q6_c
    - Y2_c
    - Y3_c
    - O3_fair
    - Q7_c
    - Q6_pen_depth_c
    - ben_col_D1m
    - ben_col_D2m
    - N5_s_bdy
    - N5_s_sms
    - N5_s_sfl
    - N5_s_bfl
    fabm_ersem_diag: # these can't be sliced in output
    - N5_s_sfl_tot_calculator_result
    - N5_s_bfl_tot_calculator_result
    - N5_s_sms_tot_calculator_result
    fabm_mizer:  # placeholder -- oceanicu_driver.py overwrites this with fish_c1..fish_c100 at generation time
    - fish_c1
    - fish_c_tot
    - fish_c_pel
    - fish_c_dem
    - fish_demPOC
    - fish_demDIC
    - fish_total_ben_prey
    - fish_w_int_diag
    - fish_c_size1
    - fish_c_size2
    - fish_c_size3
    - fish_c_lfi
    fabm_mizer_fishing:
    - fish_totlandings
    - fish_demlandings
    - fish_pellandings
  files:
  - type: netcdf
    netcdf:
      path: nse_meteo.nc
      interval: 1
      interval_units: HOURS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
      active: false
    variable_requests:
    - groups:
      - airsea_standard
      - airsea_fluxes
  - type: netcdf
    netcdf:
      path: nse_tides.nc
      interval: 1
      interval_units: HOURS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
      active: false
    variable_requests:
    - groups:
      - tidal
      fields:
      - maskt
  - type: netcdf
    netcdf:
      path: nse_2d.nc
      interval: 1
      interval_units: DAYS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
    variable_requests:
    - groups:
      - barotropic_2d
  - type: netcdf
    netcdf:
      path: nse_3d.nc
      interval: 1
      interval_units: MONTHS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
    variable_requests:
    - groups:
      - baroclinic_3d
      - barotropic_3d
      - surface_variables_3d
      time_average: true
    - groups:
      - fabm_ersem_3D
      - fabm_ersem_2D
      - fabm_ersem_diag
      requires_fabm: true
      time_average: true
    - groups:
      - fabm_mizer
      requires_fabm_dependency: fish/fishing_pressure
      time_average: true
  - type: netcdf
    netcdf:
      sync_interval: 1
      format: NETCDF4
      interval: 1
      interval_units: DAYS
      path: surf_bott_daily.nc
      start: '2010-01-01'
      stop: '2024-01-01'
    variable_requests:
    - groups:
      - fabm_mizer_fishing
      requires_fabm_dependency: fish/fishing_pressure
    - fields:
      - temp
      - salt
      groups: null
      z_index: -1
      generate_unique_name: true
    - fields:
      - temp
      - salt
      z_index: 0
      generate_unique_name: true
hydrography:
  source: WOA
  CMEMS:
    folder: ${HYDROGRAPHY_FOLDER_CMEMS}
    data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  WOA:
    folder: ${HYDROGRAPHY_FOLDER_WOA}
    data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  constant:
    temp: 9
    salt: 36
boundaries:
  barotropic:
    # No CMIP6 config (2026-10-01, same cleanup as nse_cmems.yaml, per
    # user) -- CMEMS kept (a genuinely separate, real alternate choice for
    # this role, not a CMIP6 concern).
    source: TPXO
    TPXO:
      tpxo_folder: ${TPXO_FOLDER}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMEMS}
      folder_template: null
      filename_template: hourly_{start_date}_to_{end_date}.nc
      start_date: '2024-03-02'
      end_date: '2026-01-01'
  baroclinic:
    # Same "no CMIP6 config" removal as barotropic above.
    source: WOA
    WOA:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_WOA}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMEMS}
      folder_template: null
      filename_template: daily_{start_date}_to_{end_date}.nc
      start_date: '2010-01-01'
      end_date: '2026-08-17'
  fabm:
    source: WOA
    WOA:
      folder: ${BOUNDARY_FOLDER_FABM_WOA}
      tracers:
        N3_n:
          file: woa_n.nc
          variable: n_an
          boundary_condition_type: SPONGE
        N1_p:
          file: woa_p.nc
          variable: p_an
          boundary_condition_type: SPONGE
        N5_s:
          file: woa_i.nc
          variable: i_an
          boundary_condition_type: SPONGE
        O2_o:
          file: woa_o.nc
          variable: o_an
          boundary_condition_type: SPONGE
meteo:
  # source must match simulation.airsea.type below: ERA5 needs airsea.
  # type: FluxesFromMeteo; Fluxes needs airsea.type: Fluxes -- switch both
  # `source:` here and `type:` below together. No CMIP6/CMIP6-raw config
  # (2026-10-01, same cleanup as nse_cmems.yaml, per user) -- both also
  # need FluxesFromMeteo, same as ERA5, if ever reinstated.
  source: ERA5
  ERA5:
    folder: ${ERA5_FOLDER}
    evaporation: true
    data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
  # folder deliberately left unset (an empty mapping, NOT omitted -- see
  # ChoiceSpec's own nested-vs-flat handling in yaml_parse._validate_choice:
  # a bare `Fluxes:` with nothing under it parses as YAML null, not an
  # empty dict, which breaks the nested-form detection there). Inactive
  # for now (source: ERA5 above is active) -- set source: Fluxes and a
  # real folder here (flux_taux_????.nc/flux_tauy_????.nc/flux_sp_????.nc/
  # flux_shf_????.nc/flux_swr_????.nc/flux_pe_????.nc must all exist
  # there) to switch to Fluxes' "from file" method; source: Fluxes with
  # this left empty gives Fluxes' own static constant values instead
  # (also needs simulation.airsea.type: Fluxes below to match).
  Fluxes: {}
river_discharge:
  # emorid only -- no CMIP6 sub-block (2026-10-01, same cleanup as
  # nse_cmems.yaml, per user). No real future-splice use case for this
  # config either way.
  source: emorid
  emorid:
    folder: ${RIVER_FOLDER}
    file: EMORID_1993_2024_conc_nemo_TALK_DIC.nc
    threshold: 0
    script: ${SCRIPT_FOLDER}/rivers.py:add_rivers
    data_script: ${SCRIPT_FOLDER}/rivers.py:set_river_data
fabm:
  source: none
  ERSEM:
    folder: ${FABM_ERSEM_FOLDER}
    data_script: ${SCRIPT_FOLDER}/fabm.py:configure_fabm
    # 2026-10-07, per user -- same reasoning as nse_cmems.yaml's own
    # ghg_scenario comment: splices co2/n2o_ssp245_15deg.nc + the matching
    # Ndep ssp245 files past the real historical files' 2014-12 end, for
    # whenever add_experiments.py's --type E/EM* flips fabm.source to
    # ERSEM (this base config's own source: none above leaves FABM off by
    # default, so this is inert until then). ssp245 picked arbitrarily --
    # see nse_cmems.yaml's own comment for why the choice barely matters.
    ghg_scenario: ssp245
