domain:
  method: BathymetryFile
  BathymetryFile:
    path: ${BATHYMETRY_FOLDER}/bathymetry_nse.nc
    depth_variable: depth_rx0_0p20
    lon_variable: lon
    lat_variable: lat
    mask_variable: ocean_mask
    z0: 0.01
open_boundaries:
- side: LEFT
  l: 0
  mstart: 0
  mstop: 73
  type_2d: FLATHER_TRANSPORT
- side: LEFT
  l: 0
  mstart: 137
  mstop: 169
  type_2d: FLATHER_TRANSPORT
- side: LEFT
  l: 16
  mstart: 201
  mstop: 214
  type_2d: FLATHER_TRANSPORT
- side: LEFT
  l: 36
  mstart: 214
  mstop: 227
  type_2d: FLATHER_TRANSPORT
- side: TOP
  l: 213
  mstart: 17
  mstop: 36
  type_2d: FLATHER_TRANSPORT
  type_3d: ZERO_GRADIENT
- side: TOP
  l: 226
  mstart: 37
  mstop: 77
  type_2d: FLATHER_TRANSPORT
- side: TOP
  l: 246
  mstart: 84
  mstop: 154
  type_2d: FLATHER_TRANSPORT
- side: RIGHT
  l: 256
  mstart: 120
  mstop: 136
  type_2d: FLATHER_TRANSPORT
- side: BOTTOM
  l: 0
  mstart: 1
  mstop: 35
  type_2d: FLATHER_TRANSPORT
simulation:
  runtype: BAROCLINIC
  gotm: ${GOTM_FOLDER}/gotm.yaml
  Dcrit: 0.5
  Dmin: 0.1
  advection_scheme: SUPERBEE
  vertical_coordinates:
    type: GVC
    Sigma:
      nz: 40
      ddl: 0.0
      ddu: 0.0
    GVC:
      nz: 40
      ddu: 0.75
      ddl: 0.75
      Dgamma: 10.0
      gamma_surf: true
    Adaptive:
      nz: 40
      ddu: 0.001
      ddl: 0.001
      gamma_surf: true
      Dgamma: 10.0
      csigma: 0.0
      cgvc: 1.0
      chsurf: 0.0
      hsurf: 0.5
      chmidd: 0.0
      hmidd: -4.0
      chbott: 0.0
      hbott: -0.25
      decay: 0.6666666666666666
      hpow: 3
      cneigh: 0.0
      rneigh: 0.25
      cNN: 4.0
      drho: 0.3
      cSS: 0.0
      dvel: 0.1
      chmin: 2
      hmin: 0.75
      nvfilter: 1
      vfilter: 0.3
      nhfilter: 1
      hfilter: 0.4
      timescale: 14400.0
  internal_pressure:
    type: ShchepetkinMcwilliams
    Prescribed:
      idpdx: 0.0
      idpdy: 0.0
    BlumbergMellor: {}
    ShchepetkinMcwilliams: {}
  airsea:
    type: FluxesFromMeteo
    Fluxes:
      taux: 0.0
      tauy: 0.0
      sp: 101325.0
      shf: 0.0
      swr: 0.0
      pe: 0.0
    FluxesFromMeteo:
      shortwave_method: NET_FLUX
      longwave_method: NET_FLUX
      humidity_measure: SPECIFIC_HUMIDITY
      calculate_evaporation: true
      albedo_method: PAYNE
  radiation:
    type: TwoBand
    Radiation: {}
    TwoBand:
      reflect_at_bottom: false
  momentum:
    An: 25
    Am: 0
    cnpar: 1
    avmmol: 1.8e-06
    advection_scheme: null
    advection_split_2d: FULL
    coriolis_scheme: DEFAULT
runtime:
  timestep: 20
  split_factor: 40
  dump_on_error: true
  profile: null
  check_finite: true
  report:
    days: 1
  report_totals:
    days: 7
  debug_output: false
  save_restart_interval: null
  save_restart_interval_units: null
data_assignments:
- target: simulation.radiation.A
  kind: constant
  constant_value: 0.7
- target: simulation.radiation.kc1
  kind: constant
  constant_value: 0.54
- target: simulation.radiation.kc2
  kind: constant
  constant_value: 3.23
- target: open_boundary.temp
  kind: boundary_type
  boundary_condition_type: SPONGE
- target: open_boundary.salt
  kind: boundary_type
  boundary_condition_type: SPONGE
output:
  folder: ${OUTPUT_FOLDER}
  variable_groups:
    airsea_standard:
    - u10
    - v10
    - sp
    - t2m
    - tcc
    - tp
    airsea_fluxes:
    - swr
    - shf
    - tausxu
    - tausyv
    tidal:
    - zt
    - u1
    - v1
    barotropic_2d:
    - Ht
    - zt
    - Dt
    - u1
    - v1
    barotropic_3d:
    - uk
    - vk
    - ww
    - SS
    - num
    baroclinic_3d:
    - temp
    - salt
    - rho
    - nuh
    barotropic_2d_debug:
    - maskt
    - masku
    - maskv
    - dxt
    - dyt
    - Hu
    - Hv
    - U
    - V
    - Du
    - Dv
    - dpdx
    - dpdy
    - z0bu
    - z0bv
    - z0bt
    - ru
    - rv
    barotropic_3d_debug:
    - rru
    - rrv
    - advpk
    - advqk
    - diffpk
    - diffqk
    baroclinic_3d_debug:
    - rad
    - sst
    - hnt
    - idpdx
    - idpdy
    surface_variables_3d:
    - temp
    - salt
    bottom_variables_3d:
    - temp
    - salt
    fabm_ersem:
    - P1_c
    - P2_c
    - P3_c
    - P4_c
    - O2_o
    - N3_n
    - N4_n
    - N1_p
    - N5_s
    - Q6_c
    - Y2_c
    - Y3_c
    - O3_c
    - O3_fair
    - Q7_c
    - Q6_pen_depth_c
    - ben_col_D1m
    - ben_col_D2m
    - N5_s_bdy
    - N5_s_sms
    - N5_s_sfl
    - N5_s_bfl
    - N5_s_sfl_tot_calculator_result
    - N5_s_bfl_tot_calculator_result
    - N5_s_sms_tot_calculator_result
    fabm_mizer:
    - Y2_c
    - Y3_c
    - totally_fake_fish_field_for_testing_active_toggle
  files:
  - type: netcdf
    netcdf:
      path: nse_meteo.nc
      interval: 1
      interval_units: HOURS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
      active: false
    variable_requests:
    - groups:
      - airsea_standard
      - airsea_fluxes
  - type: netcdf
    netcdf:
      path: nse_tides.nc
      interval: 1
      interval_units: HOURS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
      active: false
    variable_requests:
    - groups:
      - tidal
      fields:
      - maskt
  - type: netcdf
    netcdf:
      path: nse_2d.nc
      interval: 1
      interval_units: DAYS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
    variable_requests:
    - groups:
      - barotropic_2d
  - type: netcdf
    netcdf:
      path: nse_3d.nc
      interval: 1
      interval_units: MONTHS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
    variable_requests:
    - groups:
      - baroclinic_3d
      - barotropic_3d
      - surface_variables_3d
      time_average: true
    - groups:
      - fabm_ersem
      requires_fabm: true
      time_average: true
    - groups:
      - fabm_ersem_fish
      requires_fabm: true
      active: false  # testing the new group-level active toggle
      time_average: true
  - type: netcdf
    netcdf:
      sync_interval: 1
      format: NETCDF4
      interval: 1
      interval_units: DAYS
      path: surf_bott_daily.nc
      start: '2010-01-01'
      stop: '2020-01-01'
    variable_requests:
    - fields:
      - temp
      - salt
      groups: null
      z_index: -1
      generate_unique_name: true
    - fields:
      - temp
      - salt
      z_index: 0
      generate_unique_name: true
hydrography:
  source: WOA
  CMEMS:
    folder: ${HYDROGRAPHY_FOLDER_CMEMS}
    data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  WOA:
    folder: ${HYDROGRAPHY_FOLDER_WOA}
    data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  constant:
    temp: 9
    salt: 36
boundaries:
  barotropic:
    source: CMIP6
    TPXO:
      tpxo_folder: ${TPXO_FOLDER}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMEMS}
      folder_template: null
      filename_template: hourly_{start_date}_to_{end_date}.nc
      start_date: '2024-03-02'
      end_date: '2026-01-01'
    CMIP6:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMIP6}
      folder_template: '{model}/{scenario}/bdy'
      filename_template: bdy_2d_{start_date}_{end_date}.nc
      scenario: ssp126
      start_date: '20150101'
      end_date: '21001231'
      model: GFDL-ESM4
  baroclinic:
    source: CMIP6
    WOA:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_WOA}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMEMS}
      folder_template: null
      filename_template: daily_{start_date}_to_{end_date}.nc
      start_date: '2010-01-01'
      end_date: '2026-08-17'
    CMIP6:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMIP6}
      folder_template: '{model}/{scenario}/bdy'
      filename_template: bdy_3d_{variable}_{start_date}_{end_date}.nc
      scenario: ssp126
      start_date: '20150101'
      end_date: '21001231'
      model: GFDL-ESM4
  fabm:
    source: CMIP6
    CMEMS:
      folder: ${BOUNDARY_FOLDER_FABM_CMEMS}
      climatology: true
      tracers:
        N3_n:
          file: bio_monthly_climatology.nc
          variable: no3
          boundary_condition_type: SPONGE
        N1_p:
          file: bio_monthly_climatology.nc
          variable: po4
          boundary_condition_type: SPONGE
        N5_s:
          file: bio_monthly_climatology.nc
          variable: si
          boundary_condition_type: SPONGE
        O2_o:
          file: bio_monthly_climatology.nc
          variable: o2
          boundary_condition_type: SPONGE
    WOA:
      folder: ${BOUNDARY_FOLDER_FABM_WOA}
      tracers:
        N3_n:
          file: woa_n.nc
          variable: n_an
          boundary_condition_type: SPONGE
        N1_p:
          file: woa_p.nc
          variable: p_an
          boundary_condition_type: SPONGE
        N5_s:
          file: woa_i.nc
          variable: i_an
          boundary_condition_type: SPONGE
        O2_o:
          file: woa_o.nc
          variable: o_an
          boundary_condition_type: SPONGE
    # Real generated boundary files (2026-09-21/22, GFDL-ESM4/ssp126 only
    # so far) -- oceanicu_providers.derive_data_assignments already had
    # this branch wired (on_grid=True, climatology=False, folder_template
    # model/scenario resolution) before any real file existed to point at;
    # `file` per tracer is a literal name here (not templated), same as
    # CMEMS's own tracers[*].file above -- matches what's actually on disk
    # today, not a naming convention to rely on holding for other models/
    # scenarios without checking again. method: deltachange chosen as the
    # default since it's the only one of the 3 generation methods that
    # exists for all 6 variables (direct bias-correction only exists for
    # talk/dissic so far) -- see analyses/areas/NSe/boundaries_bio/ for the
    # per-segment comparison between methods. O3_c/O3_TA (dissic/talk) are
    # NEW here -- CMEMS/WOA above never had them (no real boundary file
    # existed for either until this session).
    CMIP6:
      folder: ${BOUNDARY_FOLDER_FABM_CMIP6}
      folder_template: '{model}/{scenario}/bdy'
      model: GFDL-ESM4
      scenario: ssp126
      tracers:
        N3_n:
          file: bdy_3d_no3_deltachange_20150101_21001231.nc
          variable: no3
          boundary_condition_type: SPONGE
        N1_p:
          file: bdy_3d_po4_deltachange_20150101_21001231.nc
          variable: po4
          boundary_condition_type: SPONGE
        N5_s:
          file: bdy_3d_si_deltachange_20150101_21001231.nc
          variable: si
          boundary_condition_type: SPONGE
        O2_o:
          file: bdy_3d_o2_deltachange_20150101_21001231.nc
          variable: o2
          boundary_condition_type: SPONGE
        O3_c:
          file: bdy_3d_dissic_deltachange_20150101_21001231.nc
          variable: dissic
          boundary_condition_type: SPONGE
        O3_TA:
          file: bdy_3d_talk_deltachange_20150101_21001231.nc
          variable: talk
          boundary_condition_type: SPONGE
meteo:
  source: CMIP6
  ERA5:
    folder: ${ERA5_FOLDER}
    evaporation: true
    data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
  CMIP6-raw:
    folder: ${CMIP6_RAW_FOLDER}
    folder_template: '{model}/{scenario}'
    scenario: ssp126
    evaporation: true
    radiation_source: components
    data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
    model: GFDL-ESM4
  CMIP6:
    folder: ${CMIP6_FOLDER}
    folder_template: CMIP6/{model}/{scenario}/meteo
    scenario: ssp126
    evaporation: true
    radiation_source: net
    data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
    model: GFDL-ESM4
  # folder deliberately left unset (an empty mapping, NOT omitted -- see
  # ChoiceSpec's own nested-vs-flat handling in yaml_parse._validate_choice:
  # a bare `Fluxes:` with nothing under it parses as YAML null, not an
  # empty dict, which breaks the nested-form detection there). Inactive
  # for now -- set source: Fluxes and a real folder here to switch to
  # Fluxes' "from file" method, or leave the folder empty for its own
  # static constant values (also needs simulation.airsea.type: Fluxes).
  Fluxes: {}
river_discharge:
  # emorid alone (no CMIP6 splice) would leave a run with no valid river
  # data at all once it runs past EMORID_1990_2024.nc's own real coverage
  # (this scenario runs to 2099) -- CMIP6 gets the same historical+scenario
  # splice as meteo/boundaries (add_rivers/set_river_data auto-includes the
  # real EMORID historical file for any [start, stop] reaching back before
  # 2015), same as nse_cmip6_raw.yaml already does correctly. No noleap
  # suffix needed here (standard calendar, unlike the raw variant).
  source: CMIP6
  emorid:
    folder: ${RIVER_FOLDER}
    file: EMORID_1990_2024.nc
    threshold: 0
    script: ${SCRIPT_FOLDER}/rivers.py:add_rivers
    data_script: ${SCRIPT_FOLDER}/rivers.py:set_river_data
  CMIP6:
    folder: ${RIVER_FOLDER_CMIP6}
    folder_template: CMIP6/{model}/{scenario}/rivers
    model: GFDL-ESM4
    scenario: ssp126
    file: river_flows_future_{scenario}.nc
    threshold: 0
    script: ${SCRIPT_FOLDER}/rivers.py:add_rivers
    data_script: ${SCRIPT_FOLDER}/rivers.py:set_river_data
fabm:
  source: ERSEM
  ERSEM:
    folder: ${FABM_ERSEM_FOLDER}
    file: /data/FABM/fabm_ersem.yaml
    data_script: ${SCRIPT_FOLDER}/fabm.py:configure_fabm
