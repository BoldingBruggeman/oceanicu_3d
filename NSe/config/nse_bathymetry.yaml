name: nse

# Load pre-existing coarse-resolution North Sea / NW European Shelf bathymetry.
# The conservative regridding step is skipped — this file IS the coarse grid.
# Optionally add  source: gebco  to read fine GEBCO data for comparison,
# phantom-island detection and thalweg analysis.
coarse_bathymetry:
  # Freshly re-extracted (ncks) from the pristine GETM source /data/kb/BLUE2/nwes/topo.nc
  # rather than from the tool's own prior output — bathymetry_nse.nc's depth_orig had
  # accumulated mask drift across earlier coarse_bathymetry chaining runs (land cells
  # reopened because depth_orig preserves depth values under masked-out cells; only
  # ocean_mask was authoritative, and that too could have absorbed the drift once a
  # reopened cell merged into the main connected basin). Starting over from topo.nc
  # avoids inheriting any of that.
  file: /home/kb/source/repos/OceanICU/oceanicu_3d/NSe/Bathymetry/topo_nse_orig.nc
  depth_var: bathymetry        # positive = ocean depth (m); -10 (missing_value) = land
  fill_from_source: false       # open coarse land cells using fine GEBCO where wet_fraction >= threshold
  fill_min_wet_fraction: 0.5   # minimum fine-source wet fraction to open a coarse cell

source: gebco           # uncomment to enable fine-source comparison

interpolation:
  cache_dir: /data/cache/regridding
  min_depth: 2.0
  # St Malo bay: same extent as the raw_patches St Malo bathymetry
  # (NSe/Bathymetry/bathymetry_st_malo.nc's own real lon/lat range). Raises
  # (never lowers) to 10 m within this bbox only, wet cells only.
  local_min_depth:
    - name: st_malo_bay
      bbox: [-3.18, -1.42, 48.5, 49.8]
      min_depth: 10.0

analysis:
  nkeep_basins: 1

fixes:
  - lon: 4.82
    lat: 60.8
    action: set_depth
    value: 110.0
  - lon: 4.90
    lat: 60.75
    action: set_depth
    value: 108.0
  - lon: 4.90
    lat: 60.7
    action: set_depth
    value: 130.0
  - lon: 4.82
    lat: 60.65
    action: set_depth
    value: 150.0

# Mask regions: force cells to land regardless of source depth.
# Types: rectangle (lon/lat bounds), polygon (vertex list),
#        point (single lon/lat), ij_rectangle / ij_point (grid-index variants).
mask_regions:
 - type: rectangle
   name: Northern Strip
   lon: [ -7.5,  6.0]
   lat: [ 60.85, 61.0]   # was 60.8 — that's the open-boundary row itself (NORTH segment,
                          # j=246); after the mask_regions rectangle-snap fix (2026-08-03)
                          # 60.8 would close that whole row instead of just abutting it

 - type: rectangle
   name: Norwegian coast
   lon: [  4.82,  4.90]
   lat: [ 60.70, 60.80]

 - type: rectangle
   name: North Western Boundary
   lon: [ -7.50, -6.30]
   lat: [ 58.50, 61.0]

 - type: rectangle
   name: North Eastern Boundary
   lon: [  4.98,  5.3]
   lat: [ 60.75, 60.8]

 - type: rectangle
   name: West of the Shetlands
   lon: [-7.50,  -1.34]
   lat: [59.85,  61.00]   # was 59.80 — that's the open-boundary row itself (NORTH segment,
                           # j=226); see Northern Strip comment above for why

 - type: rectangle
   name: West of Orkney
   lon: [-6.22, -4.70]   # was -4.62 — that's the open-boundary column itself (WEST segment,
                          # i=36); see Northern Strip comment above for why
   lat: [59.2, 59.85]

 - type: rectangle
   name: West of Hebrides
   lon: [-7.5, -6.3]
   lat: [58.4, 58.5]

 - type: point
   name: Lerwick
   lonlat: [-1.1, 60.45]

 - type: point
   name: Between Hebrides
   lonlat: [-7.1, 57.75]

 - type: polygon
   name: South Hebrides
   vertices:
     - [-7.42, 57.05]
     - [-7.34, 57.1]

 - type: point
   name: North Ireland/boundary
   lonlat: [-7.5, 55,3]

 - type: point
   name: River Dee
   lonlat: [-3.18, 53.35]

 - type: rectangle
   name: Humber
   lon: [-0.14,  0.02]
   lat: [53.65, 53.65]

 - type: rectangle
   name: Limfjorden
   lon: [ 8.18,  8.26]
   lat: [56.65, 56.75]

 - type: point
   name: Limfjorden
   lonlat: [8.26, 56.8]

 - type: rectangle
   name: Danis/German Wadden Sea
   lon: [ 8.5,  8.66]
   lat: [54.4, 55.45]

 - type: rectangle
   name: Egon
   lon: [ 8.42,  8.42]
   lat: [54.75,  54.8]

 - type: rectangle
   name: Kurt
   lon: [ 8.82,  8.82]
   lat: [54.25,  54.3]

 - type: rectangle
   name: Elbe
   lon: [ 8.74,  9.3]
   lat: [53.9,  53.9]

 - type: point
   name: Kaj
   lonlat: [8.9, 53.95]

 - type: point
   name: Busum
   lonlat: [8.98, 54.1]

thalweg:
  # auto_corridors finds articulation points in the *wet* coarse graph — it only
  # works for passages that are open in the coarse grid.  Passages that are land
  # in the coarse grid (e.g. Little Belt) need explicit waypoints below.
  auto_corridors: true
  waypoints:
    - name: "Little Belt"
      begin: [9.75, 55.58]   # northern entrance, well inside the belt
      end:   [9.9, 55.1]     # south end
      via:
        - [9.768, 55.233]    # narrowest section
      bbox: [9.3, 10.2, 55.0, 55.7]
      bbox_depth_percentile: 75
    - name: "Great Belt"
      begin: [11.0, 55.8]    # Kattegat, north of Funen
      end:   [11.0, 54.7]    # Baltic approach, south of Langeland
      bbox:  [10.5, 12.0, 54.5, 56.0]
      bbox_depth_percentile: 55
    - name: "Öresund"
      begin: [12.6, 56.1]    # Kattegat north of strait
      end:   [12.8, 55.65]   # Baltic south of Malmö
      via:
        - [12.65, 56.04]     # Helsingborg/Helsingør narrows
      bbox: [12.4, 13.0, 55.5, 56.2]
      bbox_depth_percentile: 75
    - name: "Irish Sea"
      begin: [-4.9, 51.4]    # St George's Channel / Celtic Sea entrance
      end:   [-5.7, 55.2]    # North Channel exit towards North Atlantic
      bbox:  [-7.0, -3.0, 51.0, 55.5]

smooth:
  local_filters:
    - name: "Northern boundary deep water"
      bbox: [-7.5, 6.0, 59.5, 61.0]
      filter: gaussian
      sigma: 3.0
      taper_width: 20
      taper_edge: north
      taper_shape: cosine
  rx0: 0.20
  local_rx0:
    - name: "Northern boundary tighter"
      bbox: [2.5, 6.0, 59.5, 61.0]
      rx0: 0.10

output:
  report_dir: ./report/nse/
  file: /home/kb/source/repos/OceanICU/oceanicu_3d/NSe/Bathymetry/bathymetry_nse.nc
  coastline_scale: "10m"
  log_depth_scale: true   # use log10 colour scale on depth plots
  # Inward scan depth (cells) per side — bridges thin forced-land strips.
  boundary_scan_depth:
    west: 17
    north: 10
    east: 5
    south: 5
  boundary_min_segment_cells: 3
