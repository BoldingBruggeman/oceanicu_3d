name: nse

# Load pre-existing coarse-resolution North Sea / NW European Shelf bathymetry.
# The conservative regridding step is skipped — this file IS the coarse grid.
# Optionally add  source: gebco  to read fine GEBCO data for comparison,
# phantom-island detection and thalweg analysis.
coarse_bathymetry:
  # Freshly re-extracted (ncks) from the pristine GETM source /data/kb/BLUE2/nwes/topo.nc
  # rather than from the tool's own prior output — bathymetry_nse.nc's depth_orig had
  # accumulated mask drift across earlier coarse_bathymetry chaining runs (land cells
  # reopened because depth_orig preserves depth values under masked-out cells; only
  # ocean_mask was authoritative, and that too could have absorbed the drift once a
  # reopened cell merged into the main connected basin). Starting over from topo.nc
  # avoids inheriting any of that.
  file: /home/kb/source/repos/OceanICU/oceanicu_3d/NSe/Bathymetry/topo_nse_orig.nc
  depth_var: bathymetry        # positive = ocean depth (m); -10 (missing_value) = land
  fill_from_source: false       # open coarse land cells using fine GEBCO where wet_fraction >= threshold
  fill_min_wet_fraction: 0.5   # minimum fine-source wet fraction to open a coarse cell

source: gebco           # uncomment to enable fine-source comparison

interpolation:
  cache_dir: /data/cache/regridding
  min_depth: 2.0
  # St Malo bay: same extent as the raw_patches St Malo bathymetry
  # (NSe/Bathymetry/bathymetry_st_malo.nc's own real lon/lat range). Raises
  # (never lowers) to 10 m within this bbox only, wet cells only.
  local_min_depth:
    - name: st_malo_bay
      bbox: [-3.18, -1.42, 48.5, 49.8]
      min_depth: 10.0
    # Dutch/German/Danish North Sea coast, ~Harlingen to ~Esbjerg. Only the
    # seaward edge matters -- it's traced to roughly follow the coast at a
    # modest offshore distance; the landward close is a plain straight line
    # far to the east (never mind that it crosses land -- this only ever
    # raises already-WET cells, land is excluded regardless of polygon
    # shape) capped at 9.0E specifically so it stays clear of the Little
    # Belt (~9.5-9.7E) and the rest of the Belt Sea/Kattegat, whose
    # thalweg-tuned channel depths must not get overridden by a blanket
    # 5 m floor. Verified against real coastline data (cartopy GSHHS)
    # before adding -- see conversation for the iterations.
    - name: dutch_german_danish_coast
      vertices:
        - [4.8, 53.6]
        - [6.7, 53.7]
        - [7.1, 53.75]
        - [8.4, 54.1]
        - [8.3, 54.6]
        - [7.7, 55.6]
        - [9.0, 55.6]
        - [9.0, 53.6]
      min_depth: 5.0

analysis:
  nkeep_basins: 1

fixes:
  - lon: 4.82
    lat: 60.8
    action: set_depth
    value: 110.0
  - lon: 4.90
    lat: 60.75
    action: set_depth
    value: 108.0
  - lon: 4.90
    lat: 60.7
    action: set_depth
    value: 130.0
  - lon: 4.82
    lat: 60.65
    action: set_depth
    value: 150.0
  - lon: 8.5
    lat: 53.95
    action: set_depth
    value: 4.5
  - lon: 8.18
    lat: 53.75
    action: open_cell
    value: 6.35   # phantom island: this cell is nan (land) in the pristine raw
                  # source (topo_nse_orig.nc) even though all 8 immediate
                  # neighbors are real, finite depth (0.76-18.9 m) -- no actual
                  # land here (confirmed against a real map). Value is the mean
                  # of those 8 neighbors.

# Mask regions: force cells to land regardless of source depth.
# Types: rectangle (lon/lat bounds), polygon (vertex list),
#        point (single lon/lat), ij_rectangle / ij_point (grid-index variants).
mask_regions:
 - type: rectangle
   name: Northern Strip
   lon: [ -7.5,  6.0]
   lat: [ 60.85, 61.0]   # was 60.8 — that's the open-boundary row itself (NORTH segment,
                          # j=246); after the mask_regions rectangle-snap fix (2026-08-03)
                          # 60.8 would close that whole row instead of just abutting it

 - type: rectangle
   name: Norwegian coast
   lon: [  4.82,  4.90]
   lat: [ 60.70, 60.80]

 - type: rectangle
   name: North Western Boundary
   lon: [ -7.50, -6.30]
   lat: [ 58.50, 61.0]

 - type: rectangle
   name: North Eastern Boundary
   lon: [  4.98,  5.3]
   lat: [ 60.75, 60.8]

 - type: rectangle
   name: West of the Shetlands
   lon: [-7.50,  -1.34]
   lat: [59.85,  61.00]   # was 59.80 — that's the open-boundary row itself (NORTH segment,
                           # j=226); see Northern Strip comment above for why

 - type: rectangle
   name: West of Orkney
   lon: [-6.22, -4.70]   # was -4.62 — that's the open-boundary column itself (WEST segment,
                          # i=36); see Northern Strip comment above for why
   lat: [59.2, 59.85]

 - type: rectangle
   name: West of Hebrides
   lon: [-7.5, -6.3]
   lat: [58.4, 58.5]

 - type: point
   name: Lerwick
   lonlat: [-1.1, 60.45]

 - type: point
   name: Between Hebrides
   lonlat: [-7.1, 57.75]

 - type: polygon
   name: South Hebrides
   vertices:
     - [-7.42, 57.05]
     - [-7.34, 57.1]

 - type: point
   name: North Ireland/boundary
   lonlat: [-7.5, 55.3]

 - type: point
   name: River Dee
   lonlat: [-3.18, 53.35]

 - type: rectangle
   name: Humber
   lon: [-0.14,  0.02]
   lat: [53.65, 53.65]

 - type: rectangle
   name: Limfjorden
   lon: [ 8.18,  8.26]
   lat: [56.65, 56.75]

 - type: point
   name: Limfjorden
   lonlat: [8.26, 56.8]

 - type: rectangle
   name: Danis/German Wadden Sea
   lon: [ 8.5,  8.66]
   lat: [54.4, 55.45]

 - type: rectangle
   name: Egon
   lon: [ 8.42,  8.42]
   lat: [54.75,  54.8]

 - type: rectangle
   name: Kurt
   lon: [ 8.82,  8.82]
   lat: [54.25,  54.3]

 - type: rectangle
   name: Elbe
   lon: [ 8.74,  9.3]
   lat: [53.9,  53.9]

 - type: point
   name: Kaj
   lonlat: [8.9, 53.95]

 - type: point
   name: Busum
   lonlat: [8.98, 54.1]

 # Dutch (West Frisian) and German (East Frisian) Wadden Sea barrier
 # islands -- coordinates from general geographic knowledge, NOT
 # surveyed/verified against this grid's actual resolution. Check the
 # regenerated mask/bathymetry plots against a real map before treating
 # these as final; adjust bounds if a cell or two is off.
 #
 # Each rectangle's eastern edge is extended to the next island's own
 # western edge, closing the shallow Wadden Sea water between them (not
 # just masking each island's own footprint) -- per-island resolution is
 # too coarse for this grid to stably resolve those tidal flats/channels
 # anyway. Two real gaps deliberately left OPEN, not closed: Schiermonnikoog
 # -> Borkum (the Ems estuary, Dutch/German border -- a real navigable
 # channel) and Wangerooge -> the existing "Danish/German Wadden Sea" entry
 # at 8.5 (Jade Bay/Wilhelmshaven, also a real shipping channel) -- confirm
 # before blanket-masking either.
 - type: rectangle
   name: Texel
   lon: [4.72, 4.90]
   lat: [52.92, 53.20]

 - type: rectangle
   name: Vlieland
   lon: [4.90, 5.13]
   lat: [53.24, 53.31]

 - type: rectangle
   name: Terschelling
   lon: [5.13, 5.55]
   lat: [53.36, 53.47]

 - type: rectangle
   name: Ameland
   lon: [5.55, 6.09]
   lat: [53.43, 53.48]

 - type: rectangle
   name: Schiermonnikoog
   lon: [6.09, 6.30]
   lat: [53.47, 53.52]

 - type: rectangle
   name: Borkum
   lon: [6.62, 6.95]
   lat: [53.55, 53.60]

 - type: rectangle
   name: Juist
   lon: [6.95, 7.28]
   lat: [53.65, 53.70]

 - type: rectangle
   name: Norderney
   lon: [7.15, 7.37]
   lat: [53.68, 53.75]

 - type: rectangle
   name: Baltrum
   lon: [7.35, 7.44]
   lat: [53.72, 53.75]

 - type: rectangle
   name: Langeoog
   lon: [7.44, 7.67]
   lat: [53.72, 53.78]

 - type: rectangle
   name: Spiekeroog
   lon: [7.67, 7.85]
   lat: [53.75, 53.78]

 - type: rectangle
   name: Wangerooge
   lon: [7.85, 7.95]
   lat: [53.77, 53.80]

thalweg:
  # auto_corridors finds articulation points in the *wet* coarse graph — it only
  # works for passages that are open in the coarse grid.  Passages that are land
  # in the coarse grid (e.g. Little Belt) need explicit waypoints below.
  auto_corridors: true
  waypoints:
    - name: "Little Belt"
      begin: [9.75, 55.58]   # northern entrance, well inside the belt
      end:   [9.9, 55.1]     # south end
      via:
        - [9.768, 55.233]    # narrowest section
      bbox: [9.3, 10.2, 55.0, 55.7]
      bbox_depth_percentile: 75
    - name: "Great Belt"
      begin: [11.0, 55.8]    # Kattegat, north of Funen
      end:   [11.0, 54.7]    # Baltic approach, south of Langeland
      bbox:  [10.5, 12.0, 54.5, 56.0]
      bbox_depth_percentile: 55
    - name: "Öresund"
      begin: [12.6, 56.1]    # Kattegat north of strait
      end:   [12.8, 55.65]   # Baltic south of Malmö
      via:
        - [12.65, 56.04]     # Helsingborg/Helsingør narrows
      bbox: [12.4, 13.0, 55.5, 56.2]
      bbox_depth_percentile: 75
    - name: "Irish Sea"
      begin: [-4.9, 51.4]    # St George's Channel / Celtic Sea entrance
      end:   [-5.7, 55.2]    # North Channel exit towards North Atlantic
      bbox:  [-7.0, -3.0, 51.0, 55.5]

smooth:
  local_filters:
    - name: "Northern boundary deep water"
      bbox: [-7.5, 6.0, 59.5, 61.0]
      filter: gaussian
      sigma: 3.0
      taper_width: 20
      taper_edge: north
      taper_shape: cosine
    # Generous band spanning Texel through north of Esbjerg (includes the
    # North Frisian islands too, not just Dutch/East Frisian) -- barrier
    # islands and mainland are both land, so precision doesn't matter here;
    # the wet-cell mask already confines the effect to the real Wadden Sea
    # water regardless of how far the polygon extends onto either side.
    # Capped at 9E to stay clear of the Little Belt. Verified against real
    # coastline data before adding.
    - name: wadden_sea
      vertices:
        - [4.6, 53.65]
        - [6.3, 53.90]
        - [8.0, 54.05]
        - [8.4, 54.60]
        - [7.7, 55.60]
        - [9.0, 55.60]
        - [9.0, 52.90]
        - [4.6, 52.90]
      filter: laplacian
      iterations: 20
      alpha: 0.3
  rx0: 0.20
  local_rx0:
    - name: "Northern boundary tighter"
      bbox: [2.5, 6.0, 59.5, 61.0]
      rx0: 0.10

output:
  report_dir: ./report/nse/
  file: /home/kb/source/repos/OceanICU/oceanicu_3d/NSe/Bathymetry/bathymetry_nse.nc
  coastline_scale: "10m"
  log_depth_scale: true   # use log10 colour scale on depth plots
  # Inward scan depth (cells) per side — bridges thin forced-land strips.
  boundary_scan_depth:
    west: 17
    north: 10
    east: 5
    south: 5
  boundary_min_segment_cells: 3
