# NSe open-boundary segment specification -- the single source of truth
# for this domain's open boundaries. Edit THIS file, then regenerate both
# nse_cmems.yaml's `open_boundaries:` block and
# NSe/Bathymetry/nse_bdy_lonlat.txt with:
#
#   pygetm-config boundaries-generate \
#     --domain NSe/config/nse_cmems.yaml \
#     --segments NSe/config/nse_bdy_segments.yaml \
#     --open-boundaries-out /tmp/open_boundaries_generated.yaml \
#     --bdy-lonlat-out NSe/Bathymetry/nse_bdy_lonlat.txt \
#     --plot /tmp/nse_boundaries.png --report /tmp/nse_boundaries.md
#
# See NSe/BOUNDARY_GENERATION.md section 0. Never hand-edit
# nse_bdy_lonlat.txt directly again -- it's a generated artifact now.
#
# This starting version is transcribed directly from nse_cmems.yaml's
# existing, known-good open_boundaries: block (index form, side/l/mstart/
# mstop) -- a restatement of what's already running, not a reinterpretation.
# A new segment can instead be given in guide-point form, e.g.:
#   - name: "segment 9: example"
#     lonlat_a: [-6.1, 58.6]
#     lonlat_b: [-6.1, 59.0]
#     type_2d: FLATHER_ELEV
