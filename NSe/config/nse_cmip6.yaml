      interval: 1
      interval_units: HOURS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
      active: false
    variable_requests:
    - groups:
      - airsea_standard
      - airsea_fluxes
  - type: netcdf
    netcdf:
      path: nse_tides.nc
      interval: 1
      interval_units: HOURS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
      active: false
    variable_requests:
    - groups:
      - tidal
      fields:
      - maskt
  - type: netcdf
    netcdf:
      path: nse_2d.nc
      interval: 1
      interval_units: DAYS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
    variable_requests:
    - groups:
      - barotropic_2d
  - type: netcdf
    netcdf:
      path: nse_3d.nc
      interval: 1
      interval_units: MONTHS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
    variable_requests:
    - groups:
      - baroclinic_3d
      - barotropic_3d
      - surface_variables_3d
      time_average: true
    - groups:
      - fabm_ersem_3D
      - fabm_ersem_2D
      - fabm_ersem_diag
      requires_fabm: true
      time_average: true
    - groups:
      - fabm_mizer
      - fabm_mizer_diagnostics
      requires_fabm_variable_prefix: fish
      time_average: true
    - groups:
      - fabm_mizer_fishing
      requires_fabm_dependency: fish/fishing_pressure
      time_average: true
  - type: netcdf
    netcdf:
      sync_interval: 1
      format: NETCDF4
      interval: 1
      interval_units: DAYS
      path: surf_bott_daily.nc
      start: '2010-01-01'
      stop: '2024-01-01'
    variable_requests:
    - groups:
      - fabm_mizer_fishing
      requires_fabm_dependency: fish/fishing_pressure
    - groups:
      - fabm_ersem_2D
      requires_fabm: true
    - groups:
      - fabm_ersem_3D
      requires_fabm: true
      z_index: -1
      generate_unique_name: true
    - groups:
      - fabm_ersem_3D
      requires_fabm: true
      z_index: 0
      generate_unique_name: true
    - fields:
      - temp
      - salt
      groups: null
      z_index: -1
      generate_unique_name: true
    - fields:
      - temp
      - salt
      z_index: 0
      generate_unique_name: true
  - type: netcdf
    netcdf:
      sync_interval: 1
      format: NETCDF4
      interval: 1
      interval_units: DAYS
      path: ices_daily.nc
      start: '2010-01-01'
      stop: '2024-01-01'
    variable_requests:
    - groups:
      - fabm_ices
      requires_fabm: true
    - fields:
      - temp
      - salt
hydrography:
  source: WOA
  CMEMS:
    folder: ${HYDROGRAPHY_FOLDER_CMEMS}
    data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  WOA:
    folder: ${HYDROGRAPHY_FOLDER_WOA}
    data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  constant:
    temp: 9
    salt: 36
boundaries:
  barotropic:
    source: CMIP6
    TPXO:
      tpxo_folder: ${TPXO_FOLDER}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMEMS}
      folder_template: null
      filename_template: hourly_{start_date}_to_{end_date}.nc
      start_date: '2024-03-02'
      end_date: '2026-01-01'
    CMIP6:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMIP6}
      folder_template: '{model}/{scenario}/bdy'
      filename_template: bdy_2d_{start_date}_{end_date}.nc
      scenario: <SET BY add_experiments.py --scenario>
      start_date: '20150101'
      end_date: '21001231'
      model: <SET BY add_experiments.py --model>
  baroclinic:
    source: CMIP6
    WOA:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_WOA}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMEMS}
      folder_template: null
      filename_template: daily_{start_date}_to_{end_date}.nc
      start_date: '2010-01-01'
      end_date: '2026-08-17'
    CMIP6:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMIP6}
      folder_template: '{model}/{scenario}/bdy'
      filename_template: bdy_3d_{variable}_{start_date}_{end_date}.nc
      scenario: <SET BY add_experiments.py --scenario>
      start_date: '20150101'
      end_date: '21001231'
      model: <SET BY add_experiments.py --model>
  fabm:
    source: CMIP6
    CMEMS:
      folder: ${BOUNDARY_FOLDER_FABM_CMEMS}
      climatology: true
      tracers:
        N3_n:
          file: bio_monthly_climatology.nc
          variable: no3
          boundary_condition_type: SPONGE
        N1_p:
          file: bio_monthly_climatology.nc
          variable: po4
          boundary_condition_type: SPONGE
        N5_s:
          file: bio_monthly_climatology.nc
          variable: si
          boundary_condition_type: SPONGE
        O2_o:
          file: bio_monthly_climatology.nc
          variable: o2
          boundary_condition_type: SPONGE
    WOA:
      folder: ${BOUNDARY_FOLDER_FABM_WOA}
      tracers:
        N3_n:
          file: woa_n.nc
          variable: n_an
          boundary_condition_type: SPONGE
        N1_p:
          file: woa_p.nc
          variable: p_an
          boundary_condition_type: SPONGE
        N5_s:
          file: woa_i.nc
          variable: i_an
          boundary_condition_type: SPONGE
        O2_o:
          file: woa_o.nc
          variable: o_an
          boundary_condition_type: SPONGE
    CMIP6:
      folder: ${BOUNDARY_FOLDER_FABM_CMIP6}
      folder_template: '{model}/{scenario}/bdy'
      model: <SET BY add_experiments.py --model>
      scenario: <SET BY add_experiments.py --scenario>
      # Matches nse_cmems.yaml's own explicit choice (see that file's
      # comment for the full rationale) -- a real secular-trend
      # extrapolation + Baltic salinity regression for the 2010-2014
      # dissic/talk gap, rather than the default flat cycled_climatology
      # (no trend, no Baltic-specific treatment). bio_carbon_pml_trend_
      # 20100101_20141231.nc already exists for this CMIP6-range bridge.
      dic_ta_historical_method: pml_trend
      tracers:
        N3_n:
          file: bdy_3d_no3_deltachange_20150101_21001231.nc
          variable: no3
          boundary_condition_type: SPONGE
        N1_p:
          file: bdy_3d_po4_deltachange_20150101_21001231.nc
          variable: po4
          boundary_condition_type: SPONGE
        N5_s:
          file: bdy_3d_si_deltachange_20150101_21001231.nc
          variable: si
          boundary_condition_type: SPONGE
        O2_o:
          file: bdy_3d_o2_deltachange_20150101_21001231.nc
          variable: o2
          boundary_condition_type: SPONGE
        O3_c:
          file: bdy_3d_dissic_deltachange_20150101_21001231.nc
          variable: dissic
          boundary_condition_type: SPONGE
        O3_TA:
          file: bdy_3d_talk_deltachange_20150101_21001231.nc
          variable: talk
          boundary_condition_type: SPONGE
meteo:
  source: CMIP6
  ERA5:
    folder: ${ERA5_FOLDER}
    evaporation: true
    data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
  CMIP6-raw:
    folder: ${CMIP6_RAW_FOLDER}
    folder_template: '{model}/{scenario}'
    scenario: <SET BY add_experiments.py --scenario>
    evaporation: true
    radiation_source: components
    data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
    model: <SET BY add_experiments.py --model>
  CMIP6:
    folder: ${CMIP6_FOLDER}
    folder_template: CMIP6/{model}/{scenario}/meteo
    scenario: <SET BY add_experiments.py --scenario>
    evaporation: true
    radiation_source: net
    data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
    model: <SET BY add_experiments.py --model>
  Fluxes: {}
river_discharge:
  source: CMIP6
  emorid:
    folder: ${RIVER_FOLDER}
    file: EMORID_1993_2024_conc_nemo_TALK_DIC.nc
    threshold: 0
    script: ${SCRIPT_FOLDER}/rivers.py:add_rivers
    data_script: ${SCRIPT_FOLDER}/rivers.py:set_river_data
  CMIP6:
    folder: ${RIVER_FOLDER_CMIP6}
    folder_template: CMIP6/{model}/{scenario}/rivers
    model: <SET BY add_experiments.py --model>
    scenario: <SET BY add_experiments.py --scenario>
    file: river_flows_future_{scenario}.nc
    daily: true
    nutrient_climatology: 5yr
    threshold: 0
    script: ${SCRIPT_FOLDER}/rivers.py:add_rivers
    data_script: ${SCRIPT_FOLDER}/rivers.py:set_river_data
fabm:
  source: ERSEM
  ERSEM:
    folder: ${FABM_ERSEM_FOLDER}
    file: fabm_ersem.yaml
    data_script: ${SCRIPT_FOLDER}/fabm.py:configure_fabm
    restart_file: ${FABM_RESTART_FOLDER}/restart_ersem.nc
