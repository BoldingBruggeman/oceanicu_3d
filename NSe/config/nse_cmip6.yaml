- target: open_boundary.R6_n
  kind: boundary_type
  boundary_condition_type: SPONGE
- target: open_boundary.R6_n.values
  kind: constant
  constant_value: 4.158e-05
- target: open_boundary.R6_p
  kind: boundary_type
  boundary_condition_type: SPONGE
- target: open_boundary.R6_p.values
  kind: constant
  constant_value: 2.5938e-06
- target: open_boundary.R8_c
  kind: boundary_type
  boundary_condition_type: SPONGE
- target: open_boundary.R8_c.values
  kind: constant
