    fabm_mizer_fishing:
    - fish_totlandings
    - fish_demlandings
    - fish_pellandings
  files:
  - type: netcdf
    netcdf:
      path: nse_meteo.nc
      interval: 1
      interval_units: HOURS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
      active: false
    variable_requests:
    - groups:
      - airsea_standard
      - airsea_fluxes
  - type: netcdf
    netcdf:
      path: nse_tides.nc
      interval: 1
      interval_units: HOURS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
      active: false
    variable_requests:
    - groups:
      - tidal
      fields:
      - maskt
  - type: netcdf
    netcdf:
      path: nse_2d.nc
      interval: 1
      interval_units: DAYS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
    variable_requests:
    - groups:
      - barotropic_2d
  - type: netcdf
    netcdf:
      path: nse_3d.nc
      interval: 1
      interval_units: MONTHS
      sync_interval: 1
      default_dtype: float32
      format: NETCDF4
    variable_requests:
    - groups:
      - baroclinic_3d
      - barotropic_3d
      - surface_variables_3d
      time_average: true
    - groups:
      - fabm_ersem_3D
      - fabm_ersem_2D
      - fabm_ersem_diag
      requires_fabm: true
      time_average: true
    - groups:
      - fabm_mizer
      - fabm_mizer_fishing
      requires_fabm_dependency: fish/fishing_pressure
      time_average: true
  - type: netcdf
    netcdf:
      sync_interval: 1
      format: NETCDF4
      interval: 1
      interval_units: DAYS
      path: surf_bott_daily.nc
      start: '2010-01-01'
      stop: '2020-01-01'
    variable_requests:
    - groups:
      - fabm_mizer_fishing
      requires_fabm_dependency: fish/fishing_pressure
    - groups: 
      - fabm_ersem_2D
      requires_fabm: true
    - groups:
      - fabm_ersem_3D
      requires_fabm: true
      z_index: -1
      generate_unique_name: true
    - groups:
      - fabm_ersem_3D
      requires_fabm: true
      z_index: 0
      generate_unique_name: true
    - fields:
      - temp
      - salt
      groups: null
      z_index: -1
      generate_unique_name: true
    - fields:
      - temp
      - salt
      z_index: 0
      generate_unique_name: true
hydrography:
  source: CMEMS
  CMEMS:
    folder: ${HYDROGRAPHY_FOLDER_CMEMS}
    data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  WOA:
    folder: ${HYDROGRAPHY_FOLDER_WOA}
    data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  constant:
    temp: 9
    salt: 36
boundaries:
  barotropic:
    # Pure CMEMS setup (2026-10-01, per user: "there should be no CMIP6
    # config in a CMEMS setup") -- the CMIP6 sub-block is a different
    # role's alternate choice (used by nse_cmip6.yaml/nse_cmip6_raw.yaml
    # instead), not a CMEMS concern; dropped here (same removal applied
    # throughout this file: meteo.CMIP6/CMIP6-raw, river_discharge.CMIP6,
    # boundaries.baroclinic.CMIP6 below).
    source: CMEMS
    TPXO:
      tpxo_folder: ${TPXO_FOLDER}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMEMS}
      folder_template: null
      filename_template: hourly_{start_date}_to_{end_date}.nc
      start_date: '2010-01-01'
      end_date: '2026-08-17'
  baroclinic:
    # Same "no CMIP6 config" removal as barotropic above. WOA kept (not a
    # CMIP6 concern -- a genuinely separate, real alternate choice for
    # this role).
    source: CMEMS
    WOA:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_WOA}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMEMS}
      folder_template: null
      filename_template: daily_{start_date}_to_{end_date}.nc
      start_date: '2010-01-01'
      end_date: '2026-08-17'
  fabm:
    # CMEMS, not WOA (2026-10-01, per user) -- a CMEMS setup should read
    # real CMEMS biogeochemistry at this boundary, not a WOA climatology.
    # Real DAILY product (per user, 2026-10-01), not the monthly
    # climatology -- bio_daily_2010-01-01_to_2026-08-17.nc, confirmed
    # directly on bb-server1 to carry no3/po4/si/o2 (time, nbdyp, depth),
    # same variable names already used below. climatology: false (not the
    # default already, but explicit here since this is a deliberate
    # correction away from the climatology file) -- read as a real,
    # non-cycling time series, same on_grid=True/climatology=False
    # treatment boundaries.baroclinic's own real CMEMS T/S read already
    # gets (oceanicu_providers.py's derive_data_assignments).
    source: CMEMS
    CMEMS:
      folder: ${BOUNDARY_FOLDER_FABM_CMEMS}
      climatology: false
      # O3_c (DIC)/O3_TA (alkalinity): ADDED 2026-10-02, real gap hit
      # directly on a genuine NSe/CMEMS 2010-2011 run -- without these,
      # DIC/TA simply had no boundary at all. Real coverage of
      # bio_carbon_new only starts 2024-07-29 (confirmed directly --
      # NOT 2024-02-28, an earlier stale assumption), a decade past this
      # run's own 2010-2011 period, so the historical-bridge splice
      # (dic_ta_historical_method, below) is NOT optional here the way
      # it is for CMIP6 -- every CMEMS run starting before 2024-07-29
      # needs it. pml_trend explicit (not the cycled_climatology
      # default) -- that method has no CMEMS-range (2010-01-01 to
      # 2024-07-28) bridge file built; see oceanicu_providers.py's own
      # ValueError guard for what happens if cycled_climatology is
      # selected here anyway.
      dic_ta_historical_method: pml_trend
      # tracers[*].file/variable below are the real, nbdyp-shaped
      # (boundary-point-only) daily product -- correct for the SPONGE
      # boundary read but NOT usable as a full-domain initial condition
      # (confirmed directly on bb-server1, via ncdump -h, for every CMEMS/
      # CMIP6 bio product that exists in this project today -- bio_daily
      # and bio_monthly_climatology.nc are BOTH boundary-point-shaped).
      # ic_folder/ic_file/ic_variable (see each tracer's own OPTIONAL
      # ic_file/ic_variable keys below, and oceanicu_providers.py's own
      # ic_folder ParameterSpec comment) are deliberately left UNSET here
      # (2026-10-01, per user) -- a CMEMS setup's FABM IC should come from
      # a genuinely grid-shaped CMEMS-sourced product once one exists
      # (there isn't one yet; so_2025_monthly_ic.nc/thetao_2025_monthly_
      # ic.nc are the real precedent for what that would look like for
      # bio variables too), NOT silently substituted with WOA's own
      # climatology just because that's the only grid-shaped thing
      # currently on disk -- that's a real, deliberate modeling choice for
      # whoever runs this, not a default to bake in silently. Until then,
      # unlisted tracers simply keep their own fabm.yaml-declared
      # initial_value (same as any tracer not covered by `tracers` at
      # all) -- UNLESS fabm.ERSEM.restart_file (below) is set, which takes
      # priority regardless.
      tracers:
        N3_n:
          file: bio_daily_2010-01-01_to_2026-08-17.nc
          variable: no3
          boundary_condition_type: SPONGE
        N1_p:
          file: bio_daily_2010-01-01_to_2026-08-17.nc
          variable: po4
          boundary_condition_type: SPONGE
        N5_s:
          file: bio_daily_2010-01-01_to_2026-08-17.nc
          variable: si
          boundary_condition_type: SPONGE
        O2_o:
          file: bio_daily_2010-01-01_to_2026-08-17.nc
          variable: o2
          boundary_condition_type: SPONGE
        O3_c:
          file: bio_carbon_new_2024-07-29_to_2026-08-17.nc
          variable: dissic
          boundary_condition_type: SPONGE
        O3_TA:
          file: bio_carbon_new_2024-07-29_to_2026-08-17.nc
          variable: talk
          boundary_condition_type: SPONGE
meteo:
  # ERA5 only -- no CMIP6/CMIP6-raw (2026-10-01, per user: "there should
  # be no CMIP6 config in a CMEMS setup").
  source: ERA5
  ERA5:
    folder: ${ERA5_FOLDER}
    evaporation: true
    data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
  # folder deliberately left unset (an empty mapping, NOT omitted -- see
  # ChoiceSpec's own nested-vs-flat handling in yaml_parse._validate_choice:
  # a bare `Fluxes:` with nothing under it parses as YAML null, not an
  # empty dict, which breaks the nested-form detection there). Inactive
  # for now -- set source: Fluxes and a real folder here to switch to
  # Fluxes' "from file" method, or leave the folder empty for its own
  # static constant values (also needs simulation.airsea.type: Fluxes).
  Fluxes: {}
river_discharge:
  # emorid only -- no CMIP6 sub-block (2026-10-01, per user: "there should
  # be no CMIP6 config in a CMEMS setup"). A CMEMS run never extends past
  # EMORID's own real coverage the way a CMIP6 scenario run does, so there
  # is no real future-splice use case here to keep this dormant for.
  source: emorid
  emorid:
    folder: ${RIVER_FOLDER}
    file: EMORID_1993_2024_conc_nemo_TALK_DIC.nc
    threshold: 0
    script: ${SCRIPT_FOLDER}/rivers.py:add_rivers
    data_script: ${SCRIPT_FOLDER}/rivers.py:set_river_data
fabm:
  # ERSEM pelagic spin-up (2026-10-01): enabled, with the same restart-
  # based vertical remap nse_cmip6.yaml already uses (hydrography.py's
  # _seed_fabm_state_from_restart) to seed FABM state from the perpetual-
  # ERSEM restart snapshot at the run's own start, same as that config.
  #
  # restart_file left explicitly null here (2026-10-01, per user -- a YAML
  # comment doesn't survive the generation round-trip into the companion
  # generated_*_config.yaml, so a commented-out line is invisible in the
  # file actually edited between runs; an explicit null IS kept, visible,
  # and still reads as "unset" to scripts/hydrography.py's own
  # fabm_cfg.get("restart_file") falsy check). This is round 1 of a
  # perpetual spin-up cycle (see docs/conservative-vertical-remap.md's own
  # "Why this exists" section): no restart_ersem.nc exists yet. Edit the
  # companion generated_*_config.yaml directly to set this to
  # ${FABM_RESTART_FOLDER}/restart_ersem.nc (read LIVE at runtime, no
  # regeneration needed) once round 1 has produced one via --save-restart,
  # for round 2 onward.
  source: ERSEM
  ERSEM:
    folder: ${FABM_ERSEM_FOLDER}
    restart_file: null
    file: fabm_ersem.yaml
    data_script: ${SCRIPT_FOLDER}/fabm.py:configure_fabm
    # 2026-10-07, per user: splices co2_ssp245_15deg.nc/n2o_ssp245_15deg.nc
    # (+ the matching Ndep/AMM7_Ndep_BC-EMEP_ssp245_y????.nc files) in past
    # the real historical files' own 2014-12 end -- otherwise any run past
    # 2015-01-01 (e.g. the validation/production --kind periods, which go
    # to 2024/2099) raises at FABM setup (scripts/fabm.py's own loud
    # ghg_scenario check). ssp245 picked arbitrarily -- the 4 SSPs barely
    # diverge before ~2030 (calibrated to the same real near-term
    # trajectory), and CMEMS's own real boundary/meteo/river data don't
    # reach anywhere near far enough into any SSP's actual divergence
    # period for the choice to matter here. Harmless for the registered
    # spinup experiment itself (2010-2011, never reaches 2015) -- the
    # splice is transparent for a run that never advances into it.
    ghg_scenario: ssp245
