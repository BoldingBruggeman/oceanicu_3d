domain:
  method: BathymetryFile
  BathymetryFile:
    path: ${BATHYMETRY_FOLDER}/bathymetry_nse.nc
    depth_variable: depth_rx0_0p20
    lon_variable: lon
    lat_variable: lat
    mask_variable: ocean_mask
    z0: 0.01
open_boundaries:
- side: LEFT
  l: 0
  mstart: 0
  mstop: 73
  type_2d: FLATHER_TRANSPORT
- side: LEFT
  l: 0
  mstart: 137
  mstop: 169
  type_2d: FLATHER_TRANSPORT
- side: LEFT
  l: 16
  mstart: 201
  mstop: 214
  type_2d: FLATHER_TRANSPORT
- side: LEFT
  l: 36
  mstart: 214
  mstop: 227
  type_2d: FLATHER_TRANSPORT
- side: TOP
  l: 213
  mstart: 17
  mstop: 36
  type_2d: FLATHER_TRANSPORT
  type_3d: ZERO_GRADIENT
- side: TOP
  l: 226
  mstart: 37
  mstop: 77
  type_2d: FLATHER_TRANSPORT
- side: TOP
  l: 246
  mstart: 84
  mstop: 154
  type_2d: FLATHER_TRANSPORT
- side: RIGHT
  l: 256
  mstart: 120
  mstop: 136
  type_2d: FLATHER_TRANSPORT
- side: BOTTOM
  l: 0
  mstart: 1
  mstop: 35
  type_2d: FLATHER_TRANSPORT
simulation:
  runtype: BAROCLINIC
  gotm: gotm.yaml
  Dcrit: 0.5
  Dmin: 0.1
  advection_scheme: SUPERBEE
  vertical_coordinates:
    type: GVC
    Sigma:
      nz: 40
      ddl: 0.0
      ddu: 0.0
    GVC:
      nz: 40
      ddu: 0.75
      ddl: 0.75
      Dgamma: 10.0
      gamma_surf: true
    Adaptive:
      nz: 40
      ddu: 0.001
      ddl: 0.001
      gamma_surf: true
      Dgamma: 10.0
      csigma: 0.0
      cgvc: 1.0
      chsurf: 0.0
      hsurf: 0.5
      chmidd: 0.0
      hmidd: -4.0
      chbott: 0.0
      hbott: -0.25
      decay: 0.6666666666666666
      hpow: 3
      cneigh: 0.0
      rneigh: 0.25
      cNN: 4.0
      drho: 0.3
      cSS: 0.0
      dvel: 0.1
      chmin: 2
      hmin: 0.75
      nvfilter: 1
      vfilter: 0.3
      nhfilter: 1
      hfilter: 0.4
      timescale: 14400.0
  internal_pressure:
    type: ShchepetkinMcwilliams
    Prescribed:
      idpdx: 0.0
      idpdy: 0.0
    BlumbergMellor: {}
    ShchepetkinMcwilliams: {}
  airsea:
    type: FluxesFromMeteo
    Fluxes:
      taux: 0.0
      tauy: 0.0
      sp: 101325.0
      shf: 0.0
      swr: 0.0
      pe: 0.0
    FluxesFromMeteo:
      shortwave_method: ROSATI_MIYAKODA
      longwave_method: CLARK
      humidity_measure: DEW_POINT_TEMPERATURE
      calculate_evaporation: true
      albedo_method: PAYNE
  radiation:
    type: TwoBand
    Radiation: {}
    TwoBand:
      reflect_at_bottom: false
  momentum:
    An: 25
    Am: 0
    cnpar: 1
    avmmol: 1.8e-06
    advection_scheme: null
    advection_split_2d: FULL
    coriolis_scheme: DEFAULT
runtime:
  timestep: 20
  split_factor: 40
  dump_on_error: true
  profile: null
  check_finite: true
  report:
    days: 1
  report_totals:
    days: 7
  debug_output: false
  save_restart_interval: null
  save_restart_interval_units: null
data_assignments:
- target: simulation.radiation.A
  kind: constant
  constant_value: 0.7
- target: simulation.radiation.kc1
  kind: constant
  constant_value: 1.85
- target: simulation.radiation.kc2
  kind: constant
  constant_value: 0.2
- target: open_boundary.temp
  kind: boundary_type
  boundary_condition_type: SPONGE
- target: open_boundary.salt
  kind: boundary_type
  boundary_condition_type: SPONGE
output:
  folder: ${OUTPUT_FOLDER}
  variable_groups:
    airsea_standard:
