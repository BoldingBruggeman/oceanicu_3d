    - U
    - V
    - Du
    - Dv
    - dpdx
    - dpdy
    - z0bu
    - z0bv
    - z0bt
    - ru
    - rv
    barotropic_3d_debug:
    - rru
    - rrv
    - advpk
    - advqk
    - diffpk
    - diffqk
    baroclinic_3d_debug:
    - rad
    - sst
    - hnt
    - idpdx
    - idpdy
    surface_variables_3d:
    - temp
    - salt
    bottom_variables_3d:
    - temp
    - salt
    fabm_ersem_3D:
    - P1_c
    - P2_c
    - P3_c
    - P4_c
    - O2_o
    - N3_n
    - N4_n
    - N1_p
    - N5_s
    - R1_c
    - R2_c
    - R3_c
    - R4_c
    - R6_c
    - R8_c
    - O3_c
    - O3_TA
    - Z4_c
    - Z5_c
    - Z6_c
    - B1_c   
    fabm_ersem_2D:
    - O3_fair
    - Q7_c
    - Q6_c
    - Y2_c
    - Y3_c
    - Y4_c
    - G2_o
    - G3_c
    fabm_ersem_diag: # these can't be sliced in output
    - O3_pCO2
    - O3_pH
    - ph_sf_result
    - phytoplankton_netPI_result
    - total_phytoplankton_chl_result
    - total_zooplankton_carbon_result
    - total_phytoplankton_carbon_result
    - total_smallzooplankton_carbon_result
    - Z4_fzooc_result
    - Z4_fphytoc_result
    - Z4_fsmallzooc_result
    - phytoplankton_loss_to_labile_DOC_result
    - phytoplankton_loss_to_POC_result
    - phytoplankton_loss_to_non_labile_DOC_result
    - net_PelBen_POC_result
    - Z4_fZIO3c
    - Z4_fZIRDc
    - B1_fB1O3c # bacteria fluxes for Helen P. PML
    - B1_fRPB1c
    - B1_fB1R3c
    - B1_fB1R1c
    - B1_fB1R2c
    - B1_fR1B1c
    - B1_fR2B1c
    - B1_fR3B1c
    fabm_mizer:  # placeholder -- oceanicu_driver.py overwrites this with fish_c1..fish_c100 at generation time
    - fish_c1
    - fish_c_tot
    - fish_c_pel
    - fish_c_dem
    - fish_demPOC
    - fish_demDIC
    - fish_total_ben_prey
    - fish_w_int_diag
    - fish_c_size1
    - fish_c_size2
    - fish_c_size3
    - fish_c_lfi
    - fish_prey5_c_sms
    - fish_predation_on_phytoplankton_result
    - fish_predation_on_smallzoo_result
