# NSe pygetm-config setup. runtime.time is intentionally omitted -- start/stop
# are per-invocation, not per-setup:
#   python nse_driver.py nse_from_oceanicu.yaml --start 2024-03-01T00:00:00 --stop ...
#
# A fuller, heavily-commented version of this same file (explaining how each
# field was derived from the original oceanicu config, with verification
# notes) lives in the pygetm-config repo's examples/nse_from_oceanicu.yaml --
# useful background if something here looks surprising, not needed for
# day-to-day use. See also pygetm-config's docs/yaml_vs_python.md and
# docs/overview.md for how this all fits together, and this directory's own
# nse_driver.py for what's NOT expressible as static YAML (river loading is
# the main one -- dynamic, threshold-filtered from a real file at run time).

# ----------------------------------------------------------------------
# Domain -- reads the pre-prepared bathymetry NetCDF file.
domain:
  method: BathymetryFile
  path: ${BATHYMETRY_FOLDER}/bathymetry_nse.nc
  depth_variable: depth_rx0_0p20
  lon_variable: lon
  lat_variable: lat
  mask_variable: ocean_mask
  z0: 0.01

# ----------------------------------------------------------------------
# Open boundaries -- 311 points total, regenerated from NSe/nse_bdy_lonlat.txt.
# type_3d intentionally omitted: temp/salt boundary type is forced to SPONGE
# unconditionally via data_assignments below, so a per-segment default here
# would never actually apply.
open_boundaries:
  - side: WEST
    l: 0
    mstart: 0
    mstop: 73
    type_2d: FLATHER_TRANSPORT
  - side: WEST
    l: 0
    mstart: 136
    mstop: 169
    type_2d: FLATHER_TRANSPORT
  - side: WEST
    l: 16
    mstart: 201
    mstop: 214
    type_2d: FLATHER_TRANSPORT
  - side: WEST
    l: 36
    mstart: 214
    mstop: 227
    type_2d: FLATHER_TRANSPORT
  - side: NORTH
    l: 213
    mstart: 17
    mstop: 36
    type_2d: FLATHER_TRANSPORT
  - side: NORTH
    l: 226
    mstart: 37
    mstop: 77
    type_2d: FLATHER_TRANSPORT
  - side: NORTH
    l: 246
    mstart: 84
    mstop: 154
    type_2d: FLATHER_TRANSPORT
  - side: EAST
    l: 256
    mstart: 120
    mstop: 136
    type_2d: FLATHER_TRANSPORT
  - side: SOUTH
    l: 0
    mstart: 1
    mstop: 35
    type_2d: FLATHER_TRANSPORT

# ----------------------------------------------------------------------
simulation:
  runtype: BAROCLINIC
  #runtype: BAROTROPIC_2D
  Dcrit: 0.5
  Dmin: 0.1
  # Matches run_model.py's own explicit choice.
  advection_scheme: SUPERBEE
  # delay_slow_ip/fabm: left at pyGETM's own defaults (fabm isn't modeled by
  # any provider role here at all). gotm is set dynamically by nse_driver.py
  # itself (a fixed repo asset), not a per-setup YAML value.

  # GVC is the active choice, with its real tuned values below. Sigma/
  # Adaptive are present with pyGETM's own untuned defaults -- switch via
  # `type:`, review their values before using either for real.
  vertical_coordinates:
    type: GVC
    Sigma:
      nz: 40
      ddl: 0.0
      ddu: 0.0
    GVC:
      nz: 40
      ddu: 0.75
      ddl: 0.75
      Dgamma: 10.0
      gamma_surf: true
    Adaptive:
      nz: 40
      ddu: 0.0
      ddl: 0.0
      gamma_surf: true
      Dgamma: 0.0
      csigma: 0.0
      cgvc: 1.0
      chsurf: 0.0
      hsurf: 0.5
      chmidd: 0.0
      hmidd: -4.0
      chbott: 0.0
      hbott: -0.25
      decay: 0.6666666666666666
      hpow: 3
      cneigh: 0.0
      rneigh: 0.25
      cNN: 0.0
      drho: 0.3
      cSS: 0.0
      dvel: 0.1
      chmin: 0.0
      hmin: 0.3
      nvfilter: 1
      vfilter: 0.3
      nhfilter: 1
      hfilter: 0.4
      timescale: 14400.0

  internal_pressure:
    type: ShchepetkinMcwilliams
    Prescribed:
      idpdx: 0.0
      idpdy: 0.0
    BlumbergMellor: {}
    ShchepetkinMcwilliams: {}

  # Matches run_model.py's own real, live code: TwoBand with no jerlov_type
  # (NOT Type_II -- that line is dead/commented-out in run_model.py itself).
  # A/kc1/kc2 are set via data_assignments below instead, mirroring
  # run_model.py's own post-construction .set() calls.
  radiation:
    type: TwoBand
    Radiation: {}
    TwoBand:
      reflect_at_bottom: false

  momentum:
    An: 25
    Am: 0
    cnpar: 1
    # pyGETM's real parameter name is `avmmol`, not `avmol` (the original
    # config's own key).
    avmmol: 1.8e-6
    # null so momentum genuinely falls back to simulation.advection_scheme
    # above -- momentum's own advection_scheme (if set) would otherwise take
    # priority over it. Tracers have no independent override at all.
    advection_scheme: null
    # Directional-splitting strategy for the 2D U/V transports specifically
    # (not a scheme choice). FULL is pyGETM's own real default.
    advection_split_2d: FULL
    # Interpolation method for Coriolis terms. DEFAULT is pyGETM's own real
    # default.
    coriolis_scheme: DEFAULT

# ----------------------------------------------------------------------
runtime:
  timestep: 20
  split_factor: 20
  dump_on_error: true
  profile: null
  check_finite: true
  # {days: N} is real datetime.timedelta constructor kwargs, not a plain
  # number -- report/report_totals's real type is Union[int, timedelta], so
  # a bare int would mean "N timesteps", not "N seconds". Matches
  # run_model.py's own real report=timedelta(days=1)/report_totals=
  # timedelta(days=7).
  report: {days: 1}
  report_totals: {days: 7}
  # SCHEMA-ONLY (pygetm-config), not a real pygetm parameter. When true,
  # nse_driver.py appends the matching *_debug variable_groups entry to
  # whichever output.files already reference the non-debug group.
  debug_output: false

# ----------------------------------------------------------------------
data_assignments:
  # Matches run_model.py's own real, live code exactly (fixed constants, not
  # Jerlov Type_II's own values).
  - target: simulation.radiation.A
    kind: constant
    constant_value: 0.7
  - target: simulation.radiation.kc1
    kind: constant
    constant_value: 0.54
  - target: simulation.radiation.kc2
    kind: constant
    constant_value: 3.23
  # ALTERNATIVE (not active): a real, space-varying KD490 climatology for
  # kc2 instead of the fixed constant above -- mirrors run_model.py's own
  # ObsKd: True branch. To switch: delete the kind: constant kc2 entry
  # above, uncomment this one, and give simulation.radiation.jerlov_type a
  # real value (this only ever overrides kc2, not A/kc1).
  # - target: simulation.radiation.kc2
  #   kind: file
  #   file: ${KD490_FOLDER}/KD490_clim.nc
  #   variable: KD490_filled
  #   climatology: true

  # Open-boundary 2D (barotropic tidal elevation/transport) values -- a
  # harmonic-constituent lookup via TPXO, keyed by each open boundary's own
  # lon/lat. Mirrors cfg_boundaries.py's real data_2d TPXO branch.
  - target: open_boundaries.z
    kind: tpxo
    tpxo_folder: ${TPXO_FOLDER}
    tpxo_variable: h
    on_grid: true
  - target: open_boundaries.u
    kind: tpxo
    tpxo_folder: ${TPXO_FOLDER}
    tpxo_variable: u
    on_grid: true
  - target: open_boundaries.v
    kind: tpxo
    tpxo_folder: ${TPXO_FOLDER}
    tpxo_variable: v
    on_grid: true

  # Open-boundary 3D (temp/salt) TYPE -- forced to SPONGE unconditionally
  # (mirrors cfg_boundaries.py's real data_3d exactly), regardless of each
  # open_boundaries: entry's own type_3d default above. The actual VALUES
  # (thetao/so or woa_t/woa_s) genuinely differ by boundaries.baroclinic.
  # source and are computed dynamically by nse_driver.py, not set here.
  - target: open_boundary.temp
    kind: boundary_type
    boundary_condition_type: SPONGE
  - target: open_boundary.salt
    kind: boundary_type
    boundary_condition_type: SPONGE

# ----------------------------------------------------------------------
# Output. Intervals below are illustrative -- tune to your real cadence.
# `folder` is shared across every file below; each file's own `path` is
# joined onto it unless already absolute.
output:
  folder: ${OUTPUT_FOLDER}
  # Named, reusable field-name groups, referenced by name from each file's
  # variable_requests via `groups:` instead of retyping a long field list.
  # Groups below the active ones are cataloged for later use (debug output,
  # FABM once configured, surface/bottom single-level slices) even though no
  # file references them yet.
  variable_groups:
    airsea_standard: [u10, v10, sp, t2m, tcc, tp]
    airsea_fluxes: [swr, shf, tausxu, tausyv]
    tidal: [zt, u1, v1]
    barotropic_2d: [Ht, zt, Dt, u1, v1]
    barotropic_3d: [uk, vk, ww, SS, num]
    baroclinic_3d: [temp, salt, rho, nuh]
    barotropic_2d_debug: [maskt, masku, maskv, dxt, dyt, Hu, Hv, U, V, Du, Dv, dpdx, dpdy, z0bu, z0bv, z0bt, ru, rv]
    barotropic_3d_debug: [rru, rrv, advpk, advqk, diffpk, diffqk]
    baroclinic_3d_debug: [rad, sst, hnt, idpdx, idpdy]
    surface_variables_3d: [temp, salt]
    bottom_variables_3d: [temp, salt]
    fabm_ersem: [P1_c, P2_c, P3_c, P4_c, O2_o, N3_n, N4_n, N1_p, N5_s, Q6_c, Y2_c, Y3_c, O3_c, O3_fair, Q7_c, Q6_pen_depth_c, ben_col_D1m, ben_col_D2m, N5_s_bdy, N5_s_sms, N5_s_sfl, N5_s_bfl, N5_s_sfl_tot_calculator_result, N5_s_bfl_tot_calculator_result, N5_s_sms_tot_calculator_result]
  files:
    - type: netcdf
      path: nse_meteo.nc
      interval: 1
      interval_units: HOURS
      sync_interval: null
      default_dtype: float32
      save_initial: false
      variable_requests:
        - groups: [airsea_standard, airsea_fluxes]

    - type: netcdf
      path: nse_tides.nc
      interval: 1
      interval_units: HOURS
      sync_interval: 1
      default_dtype: float32
      save_initial: false
      variable_requests:
        # maskt isn't part of the tidal group -- combined here with fields:
        # to show groups and literal fields can mix in one request.
        - groups: [tidal]
          fields: [maskt]

    - type: netcdf
      path: nse_barotropic_2d.nc
      interval: 1
      interval_units: DAYS
      sync_interval: 1
      default_dtype: float32
      save_initial: false
      variable_requests:
        - groups: [barotropic_2d]

    - type: netcdf
      path: nse_barotropic_3d.nc
      interval: 1
      interval_units: DAYS
      sync_interval: 1
      default_dtype: float32
      save_initial: false
      variable_requests:
        # Combines barotropic + baroclinic 3D fields in one file (matches
        # cfg_output.py's own real monthly-file convention).
        - groups: [barotropic_3d, baroclinic_3d]

# ----------------------------------------------------------------------
# Data provenance -- which real data source each role uses. Every real
# alternative per role stays present (not just the active one) so switching
# e.g. meteo.source: ERA5 -> CMIP6 needs no other edit. See pygetm-config's
# docs/providers.md for the mechanism, oceanicu_providers.py (this
# directory) for the real registration.
hydrography:
  source: WOA
  CMEMS:
    folder: ${HYDROGRAPHY_FOLDER_CMEMS}/init_data/nse/
  WOA:
    folder: ${HYDROGRAPHY_FOLDER_WOA}
  constant:
    temp: 9
    salt: 36
boundaries:
  barotropic:
    source: TPXO
    TPXO:
      tpxo_folder: ${TPXO_FOLDER}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMEMS}/hourly
      folder_template: "{setup}/CMEMS"
      filename_template: "hourly_{start_date}_to_{end_date}.nc"
      start_date: "2024-03-01"
      end_date: "2026-01-01"
    CMIP6:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMIP6}
      folder_template: "{setup}/CMIP6/{model}/{scenario}"
      filename_template: "{start_date}_to_{end_date}.nc"
      model: "MPI-ESM1-2-HR"
      scenario: "ssp585"
      start_date: "2024-03-01"
      end_date: "2026-01-01"
  baroclinic:
    source: WOA
    WOA:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_WOA}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMEMS}
      folder_template: "nse/daily"
      filename_template: "daily_{start_date}_to_{end_date}.nc"
      start_date: "2024-03-01"
      end_date: "2026-01-01"
    CMIP6:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMIP6}
      folder_template: "{setup}/CMIP6/{model}/{scenario}"
      filename_template: "{start_date}_to_{end_date}.nc"
      model: "MPI-ESM1-2-HR"
      scenario: "ssp585"
      start_date: "2015-01-01"
      end_date: "2025-01-01"
meteo:
  source: ERA5
  ERA5:
    # ERA5_FOLDER is the PARENT of the real .nc files -- folder_template
    # (mirroring CMIP6's own {model}/{scenario} mechanism below, same
    # nse_driver.py .format(model=..., scenario=...) call) resolves to the
    # real per-extraction subfolder ("kaj"), same shape as CMIP6's own
    # {model}/{scenario} even though ERA5 itself has no real model/scenario
    # concept -- "model" here names the extraction/processing run, not a
    # climate model.
    folder: ${ERA5_FOLDER}
    folder_template: "{model}"
    model: "kaj"
    evaporation: true
    shortwave_method: 1   # ROSATI_MIYAKODA=1, NET_FLUX=-1, DOWNWARD_FLUX=-2
    longwave_method: 1
  CMIP6:
    # The bias-corrected dataset (re-interpolated onto ERA5's own grid/
    # calendar/hourly convention, not raw CMIP6's native grid/noleap
    # calendar). nse_driver.py computes data_assignments entries for this
    # source dynamically from these values -- nothing else to edit here to
    # switch source: ERA5 -> CMIP6.
    folder: ${CMIP6_FOLDER}
    folder_template: "CMIP6/{model}/{scenario}/meteo"
    model: "GFDL-ESM4"
    scenario: "ssp126"
    evaporation: true
    shortwave_method: 1
    longwave_method: 1
river_discharge:
  source: emorid
  emorid:
    folder: ${RIVER_FOLDER}
    file: EMORID_1990_2024.nc
    threshold: 0
