# TRIMMED config -- only the keys a script-hook function actually reads
# at runtime (see the generated .py script alongside this file). Everything
# else (domain, simulation, output, ...) is already baked into literal
# Python calls in that script -- editing it here has NO effect. runtime's
# own time/check_finite/dump_on_error/timestep/split_factor/report/
# report_totals ARE read live (see the script's _emit_start/
# _emit_run_loop_and_finish-generated code); debug_output is NOT (a
# generation-time structural choice, not a runtime one).
hydrography:
  folder: ${HYDROGRAPHY_FOLDER_WOA}
  data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  source: WOA
river_discharge:
  folder: ${RIVER_FOLDER_CMIP6}
  folder_template: CMIP6/{model}/{scenario}/rivers
  file: river_flows_future_{scenario}.nc
  threshold: 0.0
  script: ${SCRIPT_FOLDER}/rivers.py:add_rivers
  data_script: ${SCRIPT_FOLDER}/rivers.py:set_river_data
  model: GFDL-ESM4
  scenario: ssp126
  source: CMIP6
meteo:
  folder: ${CMIP6_RAW_FOLDER}
  folder_template: '{model}/{scenario}'
  evaporation: true
  data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
  model: GFDL-ESM4
  scenario: ssp126
  radiation_source: components
  source: CMIP6-raw
runtime:
  timestep: 20.0
  split_factor: 40
  report:
    days: 1
  report_totals:
    days: 7
  profile: null
  dump_on_error: true
  check_finite: true
  debug_output: false
  calendar: noleap
  save_restart_interval: null
  save_restart_interval_units: null
simulation:
  runtype: 4
  advection_scheme: 5
  gotm: ${GOTM_FOLDER}/gotm.yaml
  Dmin: 0.1
  Dcrit: 0.5
  internal_pressure:
    type: ShchepetkinMcwilliams
    BlumbergMellor: {}
    Prescribed:
      idpdx: 0.0
      idpdy: 0.0
  vertical_coordinates:
    nz: 40
    ddl: 0.75
    ddu: 0.75
    gamma_surf: true
    Dgamma: 10.0
    type: GVC
    Sigma:
      nz: 40
      ddl: 0.0
      ddu: 0.0
    Adaptive:
      nz: 40
      ddu: 0.0
      ddl: 0.0
      gamma_surf: true
      Dgamma: 0.0
      csigma: 0.0
      cgvc: 1.0
      chsurf: 0.0
      hsurf: 0.5
      chmidd: 0.0
      hmidd: -4
      chbott: 0.0
      hbott: -0.25
      decay: 0.6666666666666666
      hpow: 3
      cneigh: 0.0
      rneigh: 0.25
      cNN: 0.0
      drho: 0.3
      cSS: 0.0
      dvel: 0.1
      chmin: 0.0
      hmin: 0.3
      nvfilter: 1
      vfilter: 0.3
      nhfilter: 1
      hfilter: 0.4
      timescale: 14400.0
  airsea:
    shortwave_method: -1
    longwave_method: -1
    albedo_method: 1
    humidity_measure: 4
    calculate_evaporation: true
    type: FluxesFromMeteo
    Fluxes:
      taux: 0.0
      tauy: 0.0
      sp: 101325.0
      shf: 0.0
      swr: 0.0
      pe: 0.0
  radiation:
    reflect_at_bottom: false
    type: TwoBand
    Radiation: {}
  momentum:
    Am: 0.0
    An: 25.0
    cnpar: 1.0
    advection_scheme: null
    advection_split_2d: 1
    coriolis_scheme: 1
    avmmol: 1.8e-06
