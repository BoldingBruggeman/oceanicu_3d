baseURL: 'https://bolding-bruggeman.com/oceanicu_3d/'
languageCode: 'en-us'
title: 'OceanICU shelf-sea models'
# The page frame is in layouts/ (the Bolding & Bruggeman look of the docs sites); its style
# sheets, logos and related-sites list are the docs-theme submodule at static/theme
# (git submodule update --init after a clone).
contentDir: '/data/kb/OceanICU/oceanicu_3d/content'
publishDir: '/data/kb/OceanICU/oceanicu_3d/public'
staticDir:
  - static
  - '/data/kb/OceanICU/oceanicu_3d/static'

# Rewrite root-absolute URLs (e.g. /validation-data/...) to include the
# baseURL subpath.  Required when the site is served from a subdirectory
# (e.g. https://user.github.io/repo/) rather than a bare domain.
canonifyURLs: true

disableKinds: [taxonomy, term, rss]
outputs:
  home: [HTML]
  section: [HTML]

params:
  description: "Validation results and future-scenario projections of pyGETM setups in the OceanICU project"
  brand: "OceanICU shelf-sea models"
  site: "oceanicu_3d"        # this site's key in theme/related.js

# The top bar; desc is the text of the card on the home page
menu:
  main:
    - name: Areas
      url: areas/
      weight: 1
      params: {desc: "The model domains and their simulations."}
    - name: Validations
      url: validations/
      weight: 2
      params: {desc: "Model results against observations, per area and experiment."}
    - name: Rankings
      url: rankings/
      weight: 3
      params: {desc: "Experiments compared by their skill scores."}
    - name: Scenarios
      url: scenarios/
      weight: 4
      params: {desc: "Bias-corrected CMIP6 forcing and the scenario simulations."}
    - name: Data Sources
      url: data-sources/
      weight: 6
      params: {desc: "Atmospheric forcing, ocean boundaries and rivers feeding each area."}
    - name: Data Quality
      url: guides/data-quality-checks/
      weight: 7
      params: {desc: "The checks of the forcing before a production run."}
    - name: Guides
      url: guides/
      weight: 8
      params: {desc: "How the validation and reporting tools are used."}
    - name: About
      url: about/
      weight: 9
      params: {desc: "The project, the model setups and the acknowledgement."}

# Markup settings
markup:
  goldmark:
    extensions:
      attributes: true   # Enable {style="..."} / {.class} on headings etc.
    renderer:
      unsafe: true  # Allow HTML in markdown
  highlight:
    noClasses: false   # token classes, coloured by theme/code.css (light and dark)
    lineNos: false
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 2

# Permalinks
permalinks:
  areas: /areas/:slug/
  validations: /validations/:slug/
  scenarios: /scenarios/:slug/

privacy:
  disqus:
    disable: true
  googleAnalytics:
    disable: true

minify:
  disableXML: true
  minifyOutput: true
