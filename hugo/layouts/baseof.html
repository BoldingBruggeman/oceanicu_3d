<!doctype html>
<html lang="{{ site.LanguageCode | default "en" }}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
<link rel="icon" href="{{ "theme/logo_stacked.png" | relURL }}">
<link rel="stylesheet" href="{{ "theme/style.css" | relURL }}"><link rel="stylesheet" href="{{ "theme/code.css" | relURL }}">
<link rel="stylesheet" href="{{ "site.css" | relURL }}">
</head>
<body>
{{ partial "topbar.html" . }}
{{ partial "band.html" . }}
<main>{{ block "main" . }}{{ end }}</main>
{{ partial "footer.html" . }}
</body></html>
