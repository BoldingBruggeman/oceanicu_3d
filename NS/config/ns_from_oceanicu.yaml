# NS pygetm-config setup, converted from NS/config/ns_model_config.yaml
# the same way NSe/config/nse_from_oceanicu.yaml was converted -- see that
# file's own header for the general shape/conventions this follows.
#
#   python driver/oceanicu_driver.py NS/config/ns_from_oceanicu.yaml --start ... --stop ...
#
# meteo.source is ERA5 here, not the old config's own CMIP6 choice --
# CMIP6 meteo.source IS wired up (oceanicu_driver.py has a real CMIP6
# branch); this domain's own bias-corrected data just isn't available on
# this machine. Real CMIP6 values are present below as an inactive
# alternative, ready once that data is.
#
# boundaries.barotropic/baroclinic use TPXO/WOA here, matching the old
# config's own active choices exactly (no deviation, unlike AMM7).

# ----------------------------------------------------------------------
# Domain -- unlike AMM7/NSe (a plain bathymetry NetCDF, BathymetryFile),
# this file is a real pygetm Domain.to_xarray() snapshot: H.shape is a
# supergrid (2*ny+1, 2*nx+1), T/U/V/X points interleaved by index parity,
# not a plain (ny, nx) array -- matches OceanICU's own
# Bathymetry/create_bathymetry.py (builds via create_spherical(lon, lat)
# then domain.to_xarray().to_netcdf(...)) and run_model.py's own
# create_domain() (every setup except amm7/nse routes through
# pygetm.domain.from_xarray() for exactly this reason), read via
# pygetm-config's own DomainSnapshot domain choice. z0 here overrides the
# file's own z0 variable (a 0.0 placeholder, not meant to be used as-is),
# matching run_model.py's own post-build override.
domain:
  method: DomainSnapshot
  path: ${BATHYMETRY_FOLDER}/bathymetry_ns.nc
  z0: 0.01

# ----------------------------------------------------------------------
# Open boundaries -- straight from lib/cfg_boundaries.py's own hardcoded
# `if cfg.setup == "ns":` block (4 segments, WEST/WEST/NORTH/EAST, not
# the same shape as ena4/ena8/amm7's own segments, and unlike those this
# block has no `+ 1` on its own mstop values -- used here exactly as
# given). type_3d intentionally omitted, same reasoning as NSe/AMM7
# (SPONGE forced unconditionally via data_assignments below).
open_boundaries:
  - side: WEST
    l: 0
    mstart: 1
    mstop: 16
    type_2d: FLATHER_TRANSPORT
  - side: WEST
    l: 0
    mstart: 103
    mstop: 116
    type_2d: FLATHER_TRANSPORT
  - side: NORTH
    l: 124
    mstart: 27
    mstop: 60
    type_2d: FLATHER_TRANSPORT
  - side: EAST
    l: 111
    mstart: 62
    mstop: 70
    type_2d: FLATHER_TRANSPORT

# ----------------------------------------------------------------------
simulation:
  runtype: BAROCLINIC
  gotm: ${GOTM_FOLDER}/gotm.yaml
  Dcrit: 0.5
  Dmin: 0.1
  advection_scheme: SUPERBEE

  # NS uses the same ddl as NSe/AMM7 (0.75) -- unlike ENA4/ENA8, which use
  # 0.05.
  vertical_coordinates:
    type: GVC
    Sigma:
      nz: 40
      ddl: 0.0
      ddu: 0.0
    GVC:
      nz: 40
      ddu: 0.75
      ddl: 0.75
      Dgamma: 10.0
      gamma_surf: true
    Adaptive:
      nz: 40
      ddu: 0.0
      ddl: 0.0
      gamma_surf: true
      Dgamma: 0.0
      csigma: 0.0
      cgvc: 1.0
      chsurf: 0.0
      hsurf: 0.5
      chmidd: 0.0
      hmidd: -4.0
      chbott: 0.0
      hbott: -0.25
      decay: 0.6666666666666666
      hpow: 3
      cneigh: 0.0
      rneigh: 0.25
      cNN: 0.0
      drho: 0.3
      cSS: 0.0
      dvel: 0.1
      chmin: 0.0
      hmin: 0.3
      nvfilter: 1
      vfilter: 0.3
      nhfilter: 1
      hfilter: 0.4
      timescale: 14400.0

  internal_pressure:
    type: ShchepetkinMcwilliams
    Prescribed:
      idpdx: 0.0
      idpdy: 0.0
    BlumbergMellor: {}
    ShchepetkinMcwilliams: {}

  airsea:
    type: FluxesFromMeteo
    Fluxes:
      taux: 0.0
      tauy: 0.0
      sp: 101325.0
      shf: 0.0
      swr: 0.0
      pe: 0.0
    FluxesFromMeteo:
      shortwave_method: ROSATI_MIYAKODA
      longwave_method: CLARK
      humidity_measure: DEW_POINT_TEMPERATURE
      calculate_evaporation: true

  radiation:
    type: TwoBand
    Radiation: {}
    TwoBand:
      reflect_at_bottom: false

  momentum:
    # NS uses the same An as NSe/AMM7 (25) -- unlike ENA4/ENA8, which use
    # 100.
    An: 25
    Am: 0
    cnpar: 1
    avmmol: 1.8e-6
    advection_scheme: null
    advection_split_2d: FULL
    coriolis_scheme: DEFAULT

# ----------------------------------------------------------------------
runtime:
  timestep: 60
  split_factor: 30
  dump_on_error: true
  profile: null
  check_finite: false
  report: {days: 1}
  report_totals: {days: 7}
  debug_output: false

# ----------------------------------------------------------------------
data_assignments:
  - target: simulation.radiation.A
    kind: constant
    constant_value: 0.7
  - target: simulation.radiation.kc1
    kind: constant
    constant_value: 0.54
  # ObsKd: False (unlike ENA4/ENA8/AMM7's True) -- fixed constant for kc2,
  # same as NSe.
  - target: simulation.radiation.kc2
    kind: constant
    constant_value: 3.23
  # ALTERNATIVE (not active): a real, space-varying KD490 climatology for
  # kc2 instead of the fixed constant above. To switch: delete the
  # kind: constant kc2 entry above and uncomment this one.
  # - target: simulation.radiation.kc2
  #   kind: file
  #   file: ${KD490_FOLDER}/KD490_clim.nc
  #   variable: KD490_filled
  #   climatology: true

  - target: simulation.airsea.t2m
    kind: file
    file: ${ERA5_FOLDER}/era5_t2m_????.nc
    variable: t2m
    pre_transform_offset: -273.15
  - target: simulation.airsea.d2m
    kind: file
    file: ${ERA5_FOLDER}/era5_d2m_????.nc
    variable: d2m
    pre_transform_offset: -273.15
  - target: simulation.airsea.u10
    kind: file
    file: ${ERA5_FOLDER}/era5_u10_????.nc
    variable: u10
  - target: simulation.airsea.v10
    kind: file
    file: ${ERA5_FOLDER}/era5_v10_????.nc
    variable: v10
  - target: simulation.airsea.sp
    kind: file
    file: ${ERA5_FOLDER}/era5_sp_????.nc
    variable: sp
  - target: simulation.airsea.tp
    kind: file
    file: ${ERA5_FOLDER}/era5_tp_????.nc
    variable: tp
    pre_transform_scale: 0.0002777777777777778
  - target: simulation.airsea.tcc
    kind: file
    file: ${ERA5_FOLDER}/era5_tcc_????.nc
    variable: tcc
  - target: simulation.airsea.swr
    kind: file
    file: ${ERA5_FOLDER}/era5_ssr_????.nc
    variable: ssr
    pre_transform_scale: 0.0002777777777777778
  - target: simulation.airsea.swr_downwards
    kind: file
    file: ${ERA5_FOLDER}/era5_ssrd_????.nc
    variable: ssrd
    pre_transform_scale: 0.0002777777777777778
  - target: simulation.airsea.ql
    kind: file
    file: ${ERA5_FOLDER}/era5_str_????.nc
    variable: str
    pre_transform_scale: 0.0002777777777777778
  - target: simulation.airsea.ql_downwards
    kind: file
    file: ${ERA5_FOLDER}/era5_strd_????.nc
    variable: strd
    pre_transform_scale: 0.0002777777777777778

  # open_boundaries.z/u/v (2D barotropic boundary values) are no longer
  # static entries here -- derive_data_assignments (driver/
  # oceanicu_providers.py) now derives them dynamically from
  # boundaries.barotropic.source above (TPXO/CMEMS/CMIP6), same as
  # open_boundary.temp/salt.values already is from boundaries.baroclinic.

  - target: open_boundary.temp
    kind: boundary_type
    boundary_condition_type: SPONGE
  - target: open_boundary.salt
    kind: boundary_type
    boundary_condition_type: SPONGE

# ----------------------------------------------------------------------
# Output shape: meteo=True (unlike AMM7's False), tides=False, barotropic
# default_2d/3d=False, baroclinic daily surface/bottom=True + monthly=True
# (same z_index shape as AMM7).
# save_initial deliberately omitted on every file below: defaults to true
# on a fresh start (from hydrography -- the real t=0 state is worth
# keeping) and false on a restart (--load-restart -- it's already the
# previous run's own last saved step, would be a duplicate). Give a file
# its own explicit save_initial: true/false to override this.
output:
  folder: ${OUTPUT_FOLDER}
  variable_groups:
    airsea_standard: [u10, v10, sp, t2m, tcc, tp]
    airsea_fluxes: [swr, shf, tausxu, tausyv]
    barotropic_3d: [uk, vk, ww, SS, num]
    baroclinic_3d: [temp, salt, rho, nuh]
  files:
    - type: netcdf
      path: ns_meteo.nc
      interval: 1
      interval_units: HOURS
      sync_interval: null
      default_dtype: float32
      variable_requests:
        - groups: [airsea_standard, airsea_fluxes]

    - type: netcdf
      path: ns_surface_daily.nc
      interval: 1
      interval_units: HOURS
      sync_interval: null
      default_dtype: float32
      variable_requests:
        - fields: [temp]
          z_index: -1
        - fields: [salt]
          z_index: -1

    - type: netcdf
      path: ns_bottom_daily.nc
      interval: 1
      interval_units: DAYS
      sync_interval: null
      default_dtype: float32
      variable_requests:
        - fields: [temp]
          z_index: 0
        - fields: [salt]
          z_index: 0

    - type: netcdf
      path: ns_monthly.nc
      interval: 1
      interval_units: MONTHS
      sync_interval: null
      default_dtype: float32
      variable_requests:
        - groups: [barotropic_3d, baroclinic_3d]
          time_average: true

# ----------------------------------------------------------------------
hydrography:
  source: WOA
  CMEMS:
    folder: ${HYDROGRAPHY_FOLDER_CMEMS}
  WOA:
    folder: ${HYDROGRAPHY_FOLDER_WOA}
    data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  constant:
    temp: 15
    salt: 34
boundaries:
  barotropic:
    source: TPXO
    TPXO:
      tpxo_folder: ${TPXO_FOLDER}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMEMS}
      folder_template: "ns/hourly"
      filename_template: "hourly_{start_date}_to_{end_date}.nc"
      start_date: "2015-01-01"
      end_date: "2025-01-01"
    CMIP6:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMIP6}
      folder_template: "{setup}/CMIP6/{model}/{scenario}"
      filename_template: "{start_date}_to_{end_date}.nc"
      model: "MPI-ESM1-2-HR"
      scenario: "ssp585"
      start_date: "2015-01-01"
      end_date: "2025-01-01"
  baroclinic:
    source: WOA
    WOA:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_WOA}
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMEMS}
      folder_template: "ns/boundary_data"
      filename_template: "daily_{start_date}_to_{end_date}.nc"
      start_date: "2015-01-01"
      end_date: "2025-01-01"
    CMIP6:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMIP6}
      folder_template: "{setup}/CMIP6/{model}/{scenario}"
      filename_template: "{start_date}_to_{end_date}.nc"
      model: "MPI-ESM1-2-HR"
      scenario: "ssp585"
      start_date: "2015-01-01"
      end_date: "2025-01-01"
meteo:
  source: ERA5
  ERA5:
    # folder is the FULL real path to this extraction's own .nc files (no
    # more folder_template/model indirection).
    folder: ${ERA5_FOLDER}
    evaporation: true
    # Differs from ENA4/ENA8 (NET_FLUX/DOWNWARD_FLUX, -1/-2): NS uses
    # ROSATI_MIYAKODA/CLARK (1/1) -- unrelated bulk formulas, shortwave-only
    # vs longwave-only, not the same method despite the matching "1".
    shortwave_method: 1
    longwave_method: 1
    data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
  CMIP6:
    # The old config's own active choice, kept as an inactive alternative
    # here (see module docstring above).
    folder: ${CMIP6_FOLDER}
    folder_template: "{model}/{scenario}/meteo"
    model: "MPI-ESM1-2-HR"
    scenario: "ssp585"
    evaporation: true
    shortwave_method: 1
    longwave_method: 1
river_discharge:
  source: emorid
  emorid:
    folder: ${RIVER_FOLDER}
    file: EMORID_1990_2024.nc
    threshold: 0
    script: ${SCRIPT_FOLDER}/rivers.py:add_rivers
    data_script: ${SCRIPT_FOLDER}/rivers.py:set_river_data
