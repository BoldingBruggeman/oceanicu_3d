# Per-host settings for regenerate_hugo.py. Generation runs on
# relay_host; running from any other host listed here auto-relays over
# ssh. Host key = that machine's `hostname` output.

relay_host: bb-server1

# Allowlist of areas this site publishes. IMPORTANT: on a --recursive run
# (regenerate_hugo.py's default), any area NOT listed here is actively
# pruned from the already-published site, not just skipped -- safe since
# content is always regenerated from analyses/, never hand-authored.
enabled_areas:
  - NSe
  - NS
  - AMM7

hosts:
  bb-server1:
    analyses_dir: /data/OceanICU/oceanicu_3d/analyses
    hugo_out: /data/OceanICU/oceanicu_3d
    conda_env: ocean-stack
    db: /data/OceanICU/oceanicu_3d/experiments/experiment_registry.sqlite

  orca:
    analyses_dir: /data/kb/OceanICU/oceanicu_3d/analyses
    hugo_out: /data/kb/OceanICU/oceanicu_3d
    conda_env: pygetm
    db: null   # falls back to <analyses-dir>/simulation_list.db discovery
