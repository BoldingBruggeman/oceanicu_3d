# data_inventory_forcing.yaml — Data Sources page, group 1 (generic forcing).
#
# Forcing/boundary data usable by ANY model setup (area-independent) --
# mirrors driver/oceanicu_providers.py's provider-slot roles one-to-one.
# Read by ocean-post's _generate_data_sources_page() (see
# plan_data_sources.txt). Validate with ocean-post's
# cli/validate_data_inventory.py against this project's own data_roots.yaml
# (NOT ocean-post's scylla_ocean-post_data_roots.yaml -- separate file by
# design, see that file's own header comment):
#
#   validate-data-inventory \
#     --inventory .../oceanicu_3d/driver/data_inventory_forcing.yaml \
#     --data-roots-file .../experiments/NSe/data_roots.yaml
#
# Every `path` value below uses the SAME ${VAR} names as
# driver/data_roots.yaml.example -- a `path: null` entry means "no local
# folder for this choice" (e.g. a static-constants source), not a gap.

roles:

  meteo:
    default: ERA5
    sources:
      ERA5:
        path: "${ERA5_FOLDER}"
      CMIP6:
        description: bias-corrected CMIP6 meteo (ocean-prep's bias-correction pipeline)
        # NOT just ${CMIP6_FOLDER} -- the real bias-correction output sits
        # one level deeper, under its own CMIP6/ subfolder (confirmed
        # live, 2026-10-21, trying to actually resolve real per-variable
        # file counts for this entry: ${CMIP6_FOLDER}/GFDL-ESM4/... does
        # not exist; ${CMIP6_FOLDER}/CMIP6/GFDL-ESM4/... does). The
        # scenarios/status fields below are no longer trusted for
        # anything -- the Data Sources page computes real per-model
        # scenario/file counts dynamically instead (see
        # _generate_data_sources_page's data_roots_file handling) --
        # kept only as the fallback shown when no data-roots file is
        # given at all.
        path: "${CMIP6_FOLDER}/CMIP6"
        models:
          GFDL-ESM4:
            scenarios: [historical, ssp126, ssp370]
            status: fetched
          MPI-ESM1-2-HR:
            scenarios: [historical, ssp126, ssp245, ssp370, ssp585]
            status: fetched
          CNRM-ESM2-1:
            scenarios: [historical, ssp126, ssp370]
            status: fetched
      CMIP6-raw:
        description: raw (not bias-corrected) CMIP6 archive, fetched via ocean-data's DataLoader
        path: "${CMIP6_RAW_FOLDER}"
        models:
          GFDL-ESM4:
            scenarios: [ssp126, ssp245, ssp370, ssp585]
            status: fetched
          MPI-ESM1-2-HR:
            scenarios: [ssp370]
            status: availability-only
          CNRM-ESM2-1:
            scenarios: [ssp370]
            status: availability-only
      Fluxes:
        description: prescribed taux/tauy/sp/shf/swr/pe, static per-run constants
        path: null

  river_discharge:
    default: emorid
    sources:
      emorid:
        description: EMORID/JRC, 446 real gauged stations
        path: "${RIVER_FOLDER}"
      CMIP6:
        description: delta-change-projected discharge, same 446 EMORID stations
        # Same shared bias-corrected root + /CMIP6 subfolder as
        # meteo.CMIP6 (confirmed live, 2026-10-21: river_flows_future_*/
        # nutrient_loads_future_* sit in ${RIVER_FOLDER_CMIP6}/CMIP6/
        # <model>/<scenario>/rivers/, not directly under
        # ${RIVER_FOLDER_CMIP6}). No real rivers/ dir exists for
        # historical (any model) or ssp245/ssp585 (MPI-ESM1-2-HR) at
        # all -- river discharge projections were only ever run for
        # ssp126/ssp370, unlike meteo's own broader scenario set for the
        # same models. MPI-ESM1-2-HR/CNRM-ESM2-1 weren't listed as
        # models at all before -- both really have ssp126/ssp370 data.
        path: "${RIVER_FOLDER_CMIP6}/CMIP6"
        models:
          GFDL-ESM4:
            scenarios: [ssp126, ssp370]
            status: fetched
          MPI-ESM1-2-HR:
            scenarios: [ssp126, ssp370]
            status: fetched
          CNRM-ESM2-1:
            scenarios: [ssp126, ssp370]
            status: fetched

  hydrography:
    description: initial conditions (temperature, salinity)
    default: CMEMS
    sources:
      CMEMS:
        path: "${HYDROGRAPHY_FOLDER_CMEMS}"
      WOA:
        path: "${HYDROGRAPHY_FOLDER_WOA}"
      constant:
        description: uniform temp/salt, no file
        path: null

  boundaries.barotropic:
    default: TPXO
    sources:
      TPXO:
        description: TPXO9-atlas tidal constituents
        path: "${TPXO_FOLDER}"
      CMEMS:
        path: "${BOUNDARY_FOLDER_BAROTROPIC_CMEMS}"
      CMIP6:
        description: CMIP6 monthly mean SSH / barotropic transport
        # Same real <model>/<scenario>/bdy/ tree as boundaries.baroclinic/
        # fabm's own CMIP6 entries below (bdy_2d_* files here vs their
        # bdy_3d_*) -- scenarios/status no longer trusted, same reason
        # (confirmed stale live, 2026-10-21: MPI-ESM1-2-HR/CNRM-ESM2-1
        # both already have real historical+ssp126+ssp370 data, not just
        # the one 'availability-only' scenario each listed here). The
        # Data Sources page computes real per-model scenario/file counts
        # dynamically instead -- see _REAL_FILE_SCANNERS. Kept only as
        # the fallback shown when no data-roots file is given at all.
        path: "${BOUNDARY_FOLDER_BAROTROPIC_CMIP6}"
        models:
          GFDL-ESM4:
            scenarios: [historical, ssp126, ssp370]
            status: fetched
          MPI-ESM1-2-HR:
            scenarios: [historical, ssp126, ssp370]
            status: fetched
          CNRM-ESM2-1:
            scenarios: [historical, ssp126, ssp370]
            status: fetched

  boundaries.baroclinic:
    default: CMEMS
    sources:
      CMEMS:
        path: "${BOUNDARY_FOLDER_BAROCLINIC_CMEMS}"
      WOA:
        path: "${BOUNDARY_FOLDER_BAROCLINIC_WOA}"
      CMIP6:
        description: ocean-prep's delta-change boundary output (NOT the raw CMIP6 extraction)
        # Same tree/caveat as boundaries.barotropic.CMIP6 above (this
        # entry's own bdy_3d_{so,thetao}_* files, physics only -- the
        # bio tracers in the same bdy_3d_* files belong to
        # boundaries.fabm.CMIP6 below, not here).
        path: "${BOUNDARY_FOLDER_BAROCLINIC_CMIP6}"
        models:
          GFDL-ESM4:
            scenarios: [historical, ssp126, ssp370]
            status: fetched
          MPI-ESM1-2-HR:
            scenarios: [historical, ssp126, ssp370]
            status: fetched
          CNRM-ESM2-1:
            scenarios: [historical, ssp126, ssp370]
            status: fetched

  boundaries.fabm:
    description: biogeochemical (FABM) boundary/IC tracers
    default: WOA
    sources:
      WOA:
        description: global climatology, cycled 12-month pattern
        path: "${BOUNDARY_FOLDER_FABM_WOA}"
      CMEMS:
        description: >
          real boundary-point biogeochemistry; dissic/talk pre-2015 bridged
          via dic_ta_historical_method (cycled_climatology or pml_trend)
        path: "${BOUNDARY_FOLDER_FABM_CMEMS}"
      CMIP6:
        # Same tree/caveat as boundaries.baroclinic.CMIP6 above (this
        # entry's own bdy_3d_{dissic,no3,o2,po4,si,talk}_* files, bio
        # only). Confirmed live, 2026-10-21: MPI-ESM1-2-HR/CNRM-ESM2-1
        # both have real bio-tracer files for ssp126/ssp370 (not listed
        # here at all before) -- historical is GFDL-ESM4-only for real
        # (confirmed: MPI/CNRM's historical/bdy/ has so/thetao only, no
        # bio tracers), so NOT listed as a scenario for them below.
        path: "${BOUNDARY_FOLDER_FABM_CMIP6}"
        models:
          GFDL-ESM4:
            scenarios: [historical, ssp126, ssp370]
            status: fetched
          MPI-ESM1-2-HR:
            scenarios: [ssp126, ssp370]
            status: fetched
          CNRM-ESM2-1:
            scenarios: [ssp126, ssp370]
            status: fetched

  fabm:
    description: biogeochemical model selection
    default: ERSEM
    sources:
      none:
        path: null
      ERSEM:
        path: "${FABM_ERSEM_FOLDER}"
        ghg_concentration:
          description: atmospheric CO2/N2O, input4MIPs pathway, one file per scenario
          path: "${GHG_CONCENTRATION_FOLDER}"
          scenarios: [ssp126, ssp245, ssp370, ssp585]
