# ENA4 area metadata — read by ocean-post reporting.py
#
# ---------------------------------------------------------------------------
# input_generation — how each set of input files is produced.
# ---------------------------------------------------------------------------
input_generation:

  bathymetry:
    label: "Bathymetry"
    description: >
      Regridded conservatively from GEBCO 2025 onto the ENA4 ~1/4° spherical
      grid using bathymetry-regrid (ocean-prep), with Beckmann-Haidvogel
      smoothing (rx0 ≤ 0.2).  Output: bathymetry_ena4.nc.
    configs:
      - label: "ENA4 bathymetry config"
        github_url: "https://github.com/bolding/ocean-prep/blob/main/config/ena4_bathy_create.yaml"
        cli: "bathymetry-regrid --config config/ena4_bathy_create.yaml"
        note: "Config not yet committed."

  boundaries:
    - label: "CMEMS historical boundaries (T, S, SSH, currents)"
      description: >
        AMM7 NWS MY reanalysis providing hourly barotropic and daily baroclinic
        boundary conditions for the historical period.
      configs:
        - label: "ENA4 CMEMS boundary config"
          github_url: "https://github.com/bolding/ocean-prep/blob/main/config/ena4_bdy_create.yaml"
          cli: "python cli/run_cmems_boundaries.py --config config/ena4_bdy_create.yaml"
          note: "Config not yet committed."

    - label: "Tidal boundaries (TPXO9 + CMIP6 mean SSH / barotropic transport)"
      description: >
        TPXO9-atlas tidal prediction combined with CMIP6 monthly mean
        sea-surface height and depth-integrated barotropic transport.
      configs:
        - label: "ENA4 tidal boundary config"
          github_url: "https://github.com/bolding/ocean-prep/blob/main/config/ena4_tidal_bdy.yaml"
          cli: "run-tidal-boundaries --config config/ena4_tidal_bdy.yaml"
          note: "Config not yet committed."

    - label: "3-D delta-change boundaries (T, S and optionally currents)"
      description: >
        Future 3-D boundary conditions via the delta-change method applied to
        AMM7 historical CMEMS reference with CMIP6 monthly change signal.
      configs:
        - label: "ENA4 delta-change boundary config"
          github_url: "https://github.com/bolding/ocean-prep/blob/main/config/ena4_delta_bdy.yaml"
          cli: "run-delta-boundaries --config config/ena4_delta_bdy.yaml"
          note: "Config not yet committed."

  initial_conditions:
    - label: "Initial conditions (temperature, salinity)"
      description: >
        Monthly snapshots from CMEMS NWS AMM7 MY reanalysis with flood-fill
        for NaN cells on the model grid.
      configs:
        - label: "ENA4 initial conditions config"
          github_url: "https://github.com/bolding/ocean-prep/blob/main/config/ena4_init_create.yaml"
          cli: "python cli/download_init_conditions.py --config config/ena4_init_create.yaml --source AMM7 --year 2015"
          note: "Config not yet committed."

# ---------------------------------------------------------------------------
# scenario_matrix
# ---------------------------------------------------------------------------
scenario_matrix:
  description: >
    Future ocean boundary conditions use CMIP6 model output as the
    climate-change signal on top of the historical CMEMS AMM7 reference.

  _ssp_labels:
    ssp126: "SSP1-2.6"
    ssp245: "SSP2-4.5"
    ssp370: "SSP3-7.0"
    ssp585: "SSP5-8.5"

  _type_labels:
    tidal_mean_state: "Tidal mean state (2-D)"
    delta_3d: "3-D delta-change"

  models: {}
