# AMM7 pygetm-config setup, converted from AMM7/config/amm7_model_config.yaml
# the same way NSe/config/nse_from_oceanicu.yaml was converted from
# NSe/config/nse_model_config.yaml -- see that file's own header for the
# general shape/conventions this follows (runtime.time intentionally
# omitted, --start/--stop are per-invocation).
#
#   python driver/oceanicu_driver.py AMM7/config/amm7_from_oceanicu.yaml --start ... --stop ...
#
# Two deviations from the old amm7_model_config.yaml, both documented, not
# silent:
#
# 1. boundaries.barotropic.source is TPXO here, not CMEMS (the old config's
#    own active choice) -- oceanicu_driver.py has no code building
#    barotropic 2D boundary values from CMEMS, unlike boundaries.baroclinic.
#    CMEMS, which is wired up. Real CMEMS values are present below as an
#    inactive alternative (real folder/dates), for when that gap is closed.
# 2. output's daily surface/bottom files use the `z_index` mechanism --
#    cfg_output.py's own surface/bottom output is a discrete layer slice
#    (Array.isel(z=-1)/isel(z=0)), not the schema's older `z:` param (which
#    interpolates to a fixed physical depth instead).

# ----------------------------------------------------------------------
# Domain -- reads the pre-prepared bathymetry NetCDF file. No separate mask
# variable (only bathymetry/lon/lat/grid_type) -- mask is inferred from the
# -10.0 fill value instead (the dominant value, 43385 of the real cells).
domain:
  method: BathymetryFile
  path: ${BATHYMETRY_FOLDER}/amm7_topo_getm.nc
  depth_variable: bathymetry
  lon_variable: lon
  lat_variable: lat
  mask_fill_value: -10.0
  z0: 0.01

# ----------------------------------------------------------------------
# Open boundaries -- straight from lib/cfg_boundaries.py's own hardcoded
# `if cfg.setup == "amm7":` block (5 segments), the authoritative source
# for every setup's boundary geometry. type_3d intentionally omitted:
# temp/salt boundary type is forced to SPONGE unconditionally via
# data_assignments below (cfg_boundaries.py::data_3d, domain-independent),
# so a per-segment default here would never actually apply.
open_boundaries:
  - side: WEST
    l: 1
    mstart: 1
    mstop: 353
    type_2d: FLATHER_TRANSPORT
  - side: NORTH
    l: 373
    mstart: 55
    mstop: 284
    type_2d: FLATHER_TRANSPORT
  - side: SOUTH
    l: 1
    mstart: 2
    mstop: 100
    type_2d: FLATHER_TRANSPORT
  - side: SOUTH
    l: 247
    mstart: 273
    mstop: 276
    type_2d: FLATHER_TRANSPORT
  - side: SOUTH
    l: 247
    mstart: 277
    mstop: 296
    type_2d: FLATHER_TRANSPORT

# ----------------------------------------------------------------------
simulation:
  runtype: BAROCLINIC
  gotm: ${GOTM_FOLDER}/gotm.yaml
  Dcrit: 0.5
  Dmin: 0.1
  advection_scheme: SUPERBEE

  # Same GVC values as NSe -- amm7_model_config.yaml's and
  # nse_model_config.yaml's own vertical_coordinates blocks match.
  vertical_coordinates:
    type: GVC
    Sigma:
      nz: 40
      ddl: 0.0
      ddu: 0.0
    GVC:
      nz: 40
      ddu: 0.75
      ddl: 0.75
      Dgamma: 10.0
      gamma_surf: true
    Adaptive:
      nz: 40
      ddu: 0.0
      ddl: 0.0
      gamma_surf: true
      Dgamma: 0.0
      csigma: 0.0
      cgvc: 1.0
      chsurf: 0.0
      hsurf: 0.5
      chmidd: 0.0
      hmidd: -4.0
      chbott: 0.0
      hbott: -0.25
      decay: 0.6666666666666666
      hpow: 3
      cneigh: 0.0
      rneigh: 0.25
      cNN: 0.0
      drho: 0.3
      cSS: 0.0
      dvel: 0.1
      chmin: 0.0
      hmin: 0.3
      nvfilter: 1
      vfilter: 0.3
      nhfilter: 1
      hfilter: 0.4
      timescale: 14400.0

  internal_pressure:
    type: ShchepetkinMcwilliams
    Prescribed:
      idpdx: 0.0
      idpdy: 0.0
    BlumbergMellor: {}
    ShchepetkinMcwilliams: {}

  airsea:
    type: FluxesFromMeteo
    Fluxes:
      taux: 0.0
      tauy: 0.0
      sp: 101325.0
      shf: 0.0
      swr: 0.0
      pe: 0.0
    FluxesFromMeteo:
      shortwave_method: NET_FLUX
      longwave_method: DOWNWARD_FLUX
      humidity_measure: DEW_POINT_TEMPERATURE
      calculate_evaporation: true

  radiation:
    type: TwoBand
    Radiation: {}
    TwoBand:
      reflect_at_bottom: false

  momentum:
    An: 25
    Am: 0
    cnpar: 1
    avmmol: 1.8e-6
    advection_scheme: null
    advection_split_2d: FULL
    coriolis_scheme: DEFAULT

# ----------------------------------------------------------------------
runtime:
  timestep: 10
  split_factor: 30
  dump_on_error: true
  profile: null
  check_finite: false
  report: {days: 1}
  report_totals: {days: 7}
  debug_output: false

# ----------------------------------------------------------------------
data_assignments:
  - target: simulation.radiation.A
    kind: constant
    constant_value: 0.7
  - target: simulation.radiation.kc1
    kind: constant
    constant_value: 0.54
  # AMM7's ObsKd: True (unlike NSe's False) -- a space-varying KD490
  # climatology for kc2 instead of a fixed constant, matching run_model.py's
  # own ObsKd branch.
  - target: simulation.radiation.kc2
    kind: file
    file: ${KD490_FOLDER}/KD490_clim.nc
    variable: KD490_filled
    climatology: true

  - target: simulation.airsea.t2m
    kind: file
    file: ${ERA5_FOLDER}/era5_t2m_????.nc
    variable: t2m
    pre_transform_offset: -273.15
  - target: simulation.airsea.d2m
    kind: file
    file: ${ERA5_FOLDER}/era5_d2m_????.nc
    variable: d2m
    pre_transform_offset: -273.15
  - target: simulation.airsea.u10
    kind: file
    file: ${ERA5_FOLDER}/era5_u10_????.nc
    variable: u10
  - target: simulation.airsea.v10
    kind: file
    file: ${ERA5_FOLDER}/era5_v10_????.nc
    variable: v10
  - target: simulation.airsea.sp
    kind: file
    file: ${ERA5_FOLDER}/era5_sp_????.nc
    variable: sp
  - target: simulation.airsea.tp
    kind: file
    file: ${ERA5_FOLDER}/era5_tp_????.nc
    variable: tp
    pre_transform_scale: 0.0002777777777777778
  - target: simulation.airsea.tcc
    kind: file
    file: ${ERA5_FOLDER}/era5_tcc_????.nc
    variable: tcc
  - target: simulation.airsea.swr
    kind: file
    file: ${ERA5_FOLDER}/era5_ssr_????.nc
    variable: ssr
    pre_transform_scale: 0.0002777777777777778
  - target: simulation.airsea.swr_downwards
    kind: file
    file: ${ERA5_FOLDER}/era5_ssrd_????.nc
    variable: ssrd
    pre_transform_scale: 0.0002777777777777778
  - target: simulation.airsea.ql
    kind: file
    file: ${ERA5_FOLDER}/era5_str_????.nc
    variable: str
    pre_transform_scale: 0.0002777777777777778
  - target: simulation.airsea.ql_downwards
    kind: file
    file: ${ERA5_FOLDER}/era5_strd_????.nc
    variable: strd
    pre_transform_scale: 0.0002777777777777778

  # Open-boundary 2D (barotropic tidal elevation/transport) -- TPXO is the
  # active source here (boundaries.barotropic.source above), but the
  # actual open_boundaries.z/u/v VALUES are no longer static entries in
  # this file: derive_data_assignments (driver/oceanicu_providers.py) now
  # derives them dynamically from boundaries.barotropic.source (TPXO/
  # CMEMS/CMIP6 -- CMEMS is wired up as of 2026-09-02), same as
  # open_boundary.temp/salt.values already is from boundaries.baroclinic.

  # Open-boundary 3D (temp/salt) TYPE -- forced to SPONGE unconditionally
  # (cfg_boundaries.py::data_3d, domain-independent). The actual VALUES
  # (real CMEMS thetao/so) are computed dynamically by oceanicu_driver.py,
  # not set here.
  - target: open_boundary.temp
    kind: boundary_type
    boundary_condition_type: SPONGE
  - target: open_boundary.salt
    kind: boundary_type
    boundary_condition_type: SPONGE

# ----------------------------------------------------------------------
# Output. AMM7's output shape is baroclinic-focused (no meteo/tides/
# barotropic files at all -- output.meteo/tides/barotropic.default_2d/3d
# are all False), unlike NSe's own barotropic-focused example. Daily
# surface/bottom use z_index to match cfg_output.py's own Array.isel(z=-1)/
# isel(z=0) single-layer slices; monthly uses the full 3D groups (same
# shape as NSe's own monthly-equivalent file) with time_average: true,
# matching cfg_output.py's own time_average=True for its monthly file
# (NSe's own file is NOT time-averaged -- a deliberate difference between
# the two domains).
# save_initial deliberately omitted on every file below: defaults to true
# on a fresh start (from hydrography -- the real t=0 state is worth
# keeping) and false on a restart (--load-restart -- it's already the
# previous run's own last saved step, would be a duplicate). Give a file
# its own explicit save_initial: true/false to override this.
output:
  folder: ${OUTPUT_FOLDER}
  variable_groups:
    barotropic_3d: [uk, vk, ww, SS, num]
    baroclinic_3d: [temp, salt, rho, nuh]
  files:
    - type: netcdf
      path: amm7_surface_daily.nc
      interval: 1
      interval_units: HOURS
      sync_interval: null
      default_dtype: float32
      variable_requests:
        - fields: [temp]
          z_index: -1
        - fields: [salt]
          z_index: -1

    - type: netcdf
      path: amm7_bottom_daily.nc
      interval: 1
      interval_units: DAYS
      sync_interval: null
      default_dtype: float32
      variable_requests:
        - fields: [temp]
          z_index: 0
        - fields: [salt]
          z_index: 0

    - type: netcdf
      path: amm7_monthly.nc
      interval: 1
      interval_units: MONTHS
      sync_interval: null
      default_dtype: float32
      variable_requests:
        - groups: [barotropic_3d, baroclinic_3d]
          time_average: true

# ----------------------------------------------------------------------
# Data provenance -- every real alternative per role stays present, not
# just the active one (see nse_from_oceanicu.yaml's own header for why).
hydrography:
  source: WOA
  CMEMS:
    # Differs from NSe's own CMEMS hydrography folder -- same shared var
    # name (${HYDROGRAPHY_FOLDER_CMEMS}), different value per domain, same
    # convention as ${BATHYMETRY_FOLDER}.
    folder: ${HYDROGRAPHY_FOLDER_CMEMS}
  WOA:
    folder: ${HYDROGRAPHY_FOLDER_WOA}
    data_script: ${SCRIPT_FOLDER}/hydrography.py:set_hydrography_ic
  constant:
    temp: 15
    salt: 34
boundaries:
  barotropic:
    source: TPXO
    TPXO:
      tpxo_folder: ${TPXO_FOLDER}
    # Not wired up in oceanicu_driver.py (see module docstring above) --
    # present with real values/dates for when that gap is closed. Real data:
    # boundaries/boundary_data/amm7/hourly/hourly_2015-01-01_to_2025-01-01.nc
    # -- folder_template is the literal resolved "amm7/hourly", not
    # "{setup}/CMEMS" (oceanicu_driver.py never substitutes {setup}; see
    # nse_from_oceanicu.yaml's own baroclinic.CMEMS.folder_template).
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMEMS}
      folder_template: "amm7/hourly"
      filename_template: "hourly_{start_date}_to_{end_date}.nc"
      start_date: "2015-01-01"
      end_date: "2025-01-01"
    CMIP6:
      folder: ${BOUNDARY_FOLDER_BAROTROPIC_CMIP6}
      folder_template: "{setup}/CMIP6/{model}/{scenario}"
      filename_template: "{start_date}_to_{end_date}.nc"
      model: "MPI-ESM1-2-HR"
      scenario: "ssp585"
      start_date: "2015-01-01"
      end_date: "2025-01-01"
  baroclinic:
    source: CMEMS
    WOA:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_WOA}
    # AMM7's active baroclinic boundary source -- wired up
    # (oceanicu_driver.py's own baroclinic_source == "CMEMS" branch). Real
    # data: boundaries/boundary_data/amm7/daily/
    # daily_2015-01-01_to_2025-01-01.nc -- folder_template is the literal
    # resolved "amm7/daily" (same {setup}-not-substituted reasoning as
    # barotropic.CMEMS above).
    CMEMS:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMEMS}
      folder_template: "amm7/daily"
      filename_template: "daily_{start_date}_to_{end_date}.nc"
      start_date: "2015-01-01"
      end_date: "2025-01-01"
    CMIP6:
      folder: ${BOUNDARY_FOLDER_BAROCLINIC_CMIP6}
      folder_template: "{setup}/CMIP6/{model}/{scenario}"
      filename_template: "{start_date}_to_{end_date}.nc"
      model: "MPI-ESM1-2-HR"
      scenario: "ssp585"
      start_date: "2015-01-01"
      end_date: "2025-01-01"
meteo:
  source: ERA5
  ERA5:
    # folder is the full real path to this extraction's own .nc files, no
    # folder_template/model indirection -- a different ERA5 extraction than
    # NSe's own ("NA" vs "kaj").
    folder: ${ERA5_FOLDER}
    evaporation: true
    # Differs from NSe's own ROSATI_MIYAKODA/CLARK (1/1): NET_FLUX=-1,
    # DOWNWARD_FLUX=-2 -- not the same method by another name, ROSATI_
    # MIYAKODA (shortwave) and CLARK (longwave) are unrelated bulk formulas.
    shortwave_method: -1
    longwave_method: -2
    data_script: ${SCRIPT_FOLDER}/meteo.py:set_meteo_data
  CMIP6:
    # AMM7's own values, not copied from NSe -- different model/scenario/
    # folder_template shape: {model}/{scenario}/meteo, no CMIP6/ prefix.
    folder: ${CMIP6_FOLDER}
    folder_template: "{model}/{scenario}/meteo"
    model: "MPI-ESM1-2-HR"
    scenario: "ssp585"
    evaporation: true
    shortwave_method: -1
    longwave_method: -2
river_discharge:
  source: emorid
  emorid:
    folder: ${RIVER_FOLDER}
    file: EMORID_1990_2024.nc
    threshold: 0
    script: ${SCRIPT_FOLDER}/rivers.py:add_rivers
    data_script: ${SCRIPT_FOLDER}/rivers.py:set_river_data
